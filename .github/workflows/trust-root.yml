name: trust-root
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  trust-root:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.event.pull_request.base.sha }}", fetch-depth: 0}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install pinned verifier runtime dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Fetch candidate commit as Git objects only
        env: {HEAD_SHA: "${{ github.event.pull_request.head.sha }}"}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Verify candidate with base-owned verifier artifact
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: ./scripts/platform trust verify-control-plane --base "$BASE_SHA" --head "$HEAD_SHA"
