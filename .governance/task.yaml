    - blueprints/theme-profiles/taymex.yaml
    - blueprints/experience/navigation.manifest.yaml
    - blueprints/foundation/foundation.manifest.yaml
    - docs/FOUNDATION_F8_UI_UX_REPORT.md
    - scripts/verify-f8-ui-ux.py
    - package.json
