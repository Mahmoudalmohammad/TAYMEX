acceptance:
  - id: AC-F5-CLOSURE-RUNTIME
    statement: The evidence records a clean Node 24/pnpm 11 build and actual NestJS/Fastify process smoke on the exact proven runtime revision.
  - id: AC-F5-CLOSURE-HTTP
    statement: A PostgreSQL 18.6-backed HTTP integration run proves real authentication/session handling, permission denial, AAL1 denial, AAL2 success, settings, audit, errors, security controls, rate limiting, correlation, and readiness with zero skipped tests.
  - id: AC-F5-CLOSURE-CONTRACT
    statement: Canonical OpenAPI authoring, generated operational OpenAPI/TypeScript bindings, and Nest route placeholder generation remain structurally verified and are not replaced by controller-local contract truth.
  - id: AC-F5-CLOSURE-SECURITY
    statement: The real dependency advisory run has no high-or-higher known vulnerability findings, safe error transport does not leak internal messages/stacks, and F5 does not claim distributed edge protection or production delivery concerns owned by F9.
  - id: AC-F5-CLOSURE-MATURITY
    statement: Only F5 capabilities supported by real consumer proof are promoted to PROVEN; security.data-classification remains at its satisfied INTEGRATED exit maturity and F6-F10 capabilities are not promoted by implication.
  - id: AC-F5-CLOSURE-REGRESSION
    statement: F0-F4 regression verification remains valid after lawful stage progression to F6 and requires F5 proof before accepting F5-dependent PROVEN maturity.
  - id: AC-F5-CLOSURE-GOVERNANCE
    statement: The closure-only final diff contains no runtime code, dependency, migration, platform, trust-root, or public-contract change and passes task governance, trust-root, consumer-boundary, handoff, and structural verification.
assumptions:
  - statement: The operator executed the F5 HTTP integration harness against PostgreSQL 18.6 on canonical TAYMEX revision 36602be3b40314f2b7aee8265b5fce13663a3d90 with one pass, zero fail, and zero skip.
    status: verified
    evidence: docs/evidence/F5_HTTP_SECURITY_PROOF.md
  - statement: The operator executed frozen-lockfile install/build/tests, dependency audit, actual API start smoke, task governance, trust-root verification, and handoff verification on the same runtime revision.
    status: verified
    evidence: docs/evidence/F5_HTTP_SECURITY_PROOF.md
  - statement: The accompanying ENGINEERING_PLATFORM source revision remains c3d865ee97f33c7d0247e00fdd02e0c771ea6f98.
    status: verified
    evidence: docs/evidence/F5_HTTP_SECURITY_PROOF.md
obligations:
  securityDelta: completed
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: tested
functional:
  invariants:
    - Stage closure is based on real runtime evidence tied to an exact committed implementation revision, not on documentation or structural checks alone.
    - The F5 closure commit does not modify the runtime implementation proven at 36602be3b40314f2b7aee8265b5fce13663a3d90.
    - F5 proof does not imply production merge authority, distributed edge abuse protection, production observability delivery, UI/browser proof, performance proof, or side-effect delivery proof.
    - Products remain frozen until the complete Foundation Readiness Gate passes.
  statesAndTransitions:
    - F5 current and runtime proof pending -> F5 closed and currentStage F6 only after the exact runtime evidence is recorded and closure governance passes.
  edgeCases:
    - a platform authorization error does not inherit the application error hierarchy
    - OpenAPI path parameters use braces while Nest route parameters use colon syntax
    - PostgreSQL joined scope columns are ambiguous unless qualified
    - a later-stage verifier reinterprets lawful maturity progression as an F4 regression
  failureModes:
    - promoting capabilities not exercised by the F5 runtime proof
    - claiming runtime tests ran on the closure metadata commit rather than the exact tested implementation revision
    - weakening governance or tests to transform a runtime failure into PASS
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
