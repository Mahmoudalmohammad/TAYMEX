id: FOUNDATION-F2-001
title: Implement identity authentication sessions and access foundation
mode: feature
risk: R3
objective: Implement the F2 identity and access foundation as framework-neutral contracts for accounts, password credentials and recovery, secure session lifecycle, authenticated actor context, role-to-permission resolution, authentication throttling and canonical security events, then integrate the actor context into the existing Catalog authorization path without adding HTTP, database, UI, or product features.
