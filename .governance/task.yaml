id: FOUNDATION-001
title: Establish TAYMEX foundation blueprint and readiness gate
mode: feature
risk: R2
objective: Define the complete cross-cutting application foundation that must be implemented and proven before expanding TAYMEX domain features, with one human blueprint and one machine-readable readiness manifest, without changing runtime product behavior.
baseRevision: 41b8586c37ec8169dd62e61b387de0ded521b741
modules:
  - catalog
scope:
  allowedPaths:
    - docs/FOUNDATION_BLUEPRINT.md
    - blueprints/foundation/foundation.manifest.yaml
    - scripts/foundation-status.py
    - .governance/task.yaml
  forbiddenPaths:
    - apps/**
    - tooling/**
    - .github/**
    - .platform/**
  allowNewFiles: true
  allowedNewFiles:
    - docs/FOUNDATION_BLUEPRINT.md
    - blueprints/foundation/foundation.manifest.yaml
    - scripts/foundation-status.py
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
acceptance:
  - id: AC-FOUNDATION-SCOPE
    statement: The blueprint defines the complete cross-cutting foundation required before broad domain feature construction, including architecture, identity, authorization, settings, data, API, errors, audit, observability, security, performance, UI/UX, localization, files/media, notifications/events, testing, and operations.
  - id: AC-FOUNDATION-GATE
    statement: The machine-readable manifest classifies every foundation capability by current maturity and required exit maturity and can report whether feature expansion is blocked.
  - id: AC-CLEAN-SYSTEM
    statement: The new blueprint is self-contained and contains no historical project references or migration narrative.
  - id: AC-NO-RUNTIME-CHANGE
    statement: No application runtime behavior, domain model, database schema, API contract, dependency, platform package, or protected governance policy changes in this task.
assumptions:
  - statement: The existing Products implementation remains a validation slice and may be used later to prove foundation capabilities, but no new persistence/API/UI Product expansion occurs until the foundation gate is satisfied.
    status: verified
    evidence: Current project execution decision.
  - statement: Optional domain capabilities such as commerce, payments, solar-engine, search, CMS, AI, and tenancy are not part of the mandatory application foundation unless a cross-cutting mechanism is required by multiple future modules.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
obligations:
  securityDelta: not-applicable
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Domain feature expansion remains blocked while any mandatory foundation capability is below its exit maturity.
    - Designed documentation alone is not sufficient evidence for a foundation capability to pass.
    - Optional product capabilities do not become foundation requirements merely because they may be needed later.
  edgeCases:
    - A capability is architecturally designed but not implemented.
    - A capability is implemented in the platform but not integrated in TAYMEX.
    - A capability is integrated locally but not proven on the real runtime or merge authority where required.
  failureModes:
    - Readiness checker reports READY while a mandatory capability is below required maturity.
    - Foundation documentation becomes a second source of runtime settings or permissions instead of referencing machine registries.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
