id: FOUNDATION-F8-RSC-SERIALIZATION-007
title: Repair F8 RSC serialization boundary for localized pagination copy
mode: fix
risk: R2
objective: >-
  Repair the exact F8 React Server Component serialization failure exposed by R9 by making the UI reference copy passed from the server to the client data-only and serializable, while preserving locale-specific pagination wording and leaving pagination behavior inside the client boundary.
baseRevision: 24419f7374e7769ee78e8423c13822a89e27c052
