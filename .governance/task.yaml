id: FOUNDATION-F4-001
title: Implement PostgreSQL data and transaction foundation
mode: migration
risk: R3
objective: >-
  Implement F4 as the single PostgreSQL 18 persistence foundation for TAYMEX: define governed Drizzle PostgreSQL schema truth and immutable additive SQL migration history, provide a node-postgres pool/transaction boundary with nested transaction reuse, implement PostgreSQL persistence adapters for identity roles settings and audit, enforce database-level optimistic compare-and-swap and append-only audit integrity, add reusable persisted idempotency semantics, and wire PostgreSQL readiness without advancing to F5 unless real PostgreSQL execution evidence exists.
