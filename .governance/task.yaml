  allowControlPlaneChanges: true
  allowTrustRootChanges: false
acceptance:
  - id: AC-F9-OBSERVABILITY-AUTHORITY
    statement: The production-delivery authority defines line-delimited JSON logging, UTC timestamps, release/service identity, correlation propagation, safe error representation, strict recursive redaction, and clear separation of process liveness from dependency readiness.
  - id: AC-F9-RUNTIME-LOGGING-PROOF
    statement: Real HTTP runtime execution demonstrates that correlation IDs propagate from request header through response header into structured log records, with zero leakage of passwords, hashes, tokens, or database connection credentials.
  - id: AC-F9-SAFE-ERROR-MASKING
    statement: Internal error stack traces are strictly masked from client HTTP responses while preserving safe structured error codes and correlation tracking.
  - id: AC-F9-ABUSE-PROTECTION-BASELINE
    statement: In-process request body size bounds, timeouts, parameter limits, and throttling are verified locally while multi-instance distributed rate limiting and WAF protection are formally designated as edge/gateway responsibilities marked PENDING_PROVIDER_PROFILE.
  - id: AC-F9-NEGATIVE-PROOF-GATES
    statement: Automated verifiers strictly reject premature PROVEN claims for telemetry delivery or edge protection when cloud provider profiles are unprovisioned.
assumptions:
  - statement: R15 is the accepted F9-002 canonical baseline at TAYMEX e452a88d061041e376f533f09708aa63882da8c4.
    status: verified
    evidence: blueprints/foundation/foundation.manifest.yaml
  - statement: Cloud telemetry collector forwarders and distributed edge WAF providers are not provisioned in local validation and remain PENDING_PROVIDER_PROFILE.
    status: verified
    evidence: operations/f9/production-delivery.authority.yaml
obligations:
  securityDelta: required
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: required
functional:
  invariants:
    - Log egress must never contain passwords, password hashes, bearer tokens, or database passwords.
    - Process liveness probe must never fail due to external database connectivity.
    - Client error responses must never expose internal stack traces.
    - Per-process in-memory limiters must not be claimed as multi-instance distributed rate limiters.
  statesAndTransitions:
    - Observability and abuse authority extended -> IMPLEMENTED_LOCAL_BASELINE only after machine-readable contracts, runtime proof, and verifiers are committed.
    - IMPLEMENTED -> PROVEN requires real cloud telemetry collector proof and distributed edge abuse protection.
  edgeCases:
    - Malformed JSON payloads must return 400 validation error without unhandled exception stack traces.
    - Oversized payloads exceeding body limit must return 413 without process crashing.
    - Authentication failures must record security event logs with safe reason codes and no password leakage.
  failureModes:
    - Exposing database passwords or authorization tokens in structured logs or diagnostics.
    - Failing process liveness because PostgreSQL is temporarily unreachable.
    - Hardcoding speculative cloud vendor log ingestion endpoints before deployment profile selection.
requiredGates:
