id: FOUNDATION-F4-REVIEW-002
title: Deep-audit and harden F0-F4 before F4 closure
mode: migration
risk: R3
objective: >-
  Preserve the complete project problem and expert-review context inside the TAYMEX repository, audit F0-F4 against the historical failure classes and authoritative foundation contracts, fix only verified defects at their owning shared layer, harden PostgreSQL migration/transaction/concurrency/idempotency/data-truth behavior, remove accidental production fallback paths, and produce explicit evidence without advancing F4 unless actual PostgreSQL 18 proof is obtained.
baseRevision: 726d4e491eecca1e97912c444f1196fc8d7b465b
modules:
  - data-postgres
  - identity
  - settings-runtime
  - audit
  - observability
