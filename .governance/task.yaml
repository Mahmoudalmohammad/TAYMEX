id: FOUNDATION-F3-001
title: Implement settings audit and observability foundation
mode: feature
risk: R3
objective: >-
  Implement F3 as three explicit application-foundation capabilities: a runtime settings administration layer that reuses canonical generated definitions and the platform resolver without duplicating precedence, an append-only redacting audit core that records identity security and settings administration evidence, and structured observability primitives for correlation redaction logging liveness and readiness; integrate only the existing health and Catalog settings validation paths and advance sequencing to F4 without claiming PostgreSQL or HTTP security proof.
