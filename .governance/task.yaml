acceptance:
  - id: AC-F4-SCHEMA-TRUTH
    statement: Persisted foundation tables are declared as PostgreSQL Drizzle schema truth under exactly one owning module and match the additive migration schema; database ownership is discoverable by repository truth rather than inferred from prose.
  - id: AC-F4-MIGRATIONS
    statement: Migration execution is ordered checksummed immutable advisory-lock protected and transactional; checksum drift of an already applied migration blocks execution and F4 introduces no destructive migration.
  - id: AC-F4-TRANSACTIONS
    statement: One PostgreSQL transaction boundary owns BEGIN COMMIT ROLLBACK and nested foundation calls reuse the active connection so a settings or identity write and its durable audit record can participate in the same transaction.
  - id: AC-F4-CONCURRENCY
    statement: Account role session challenge and setting mutable records use database-side expected-version predicates or equivalent atomic PostgreSQL semantics; stale writes never silently overwrite accepted state.
  - id: AC-F4-IDEMPOTENCY
    statement: A reusable persisted idempotency primitive atomically claims an operation key binds it to a request hash and replays only the completed matching result while rejecting key reuse with different input.
  - id: AC-F4-INTEGRITY
    statement: PostgreSQL constraints enforce normalized-email uniqueness status and assurance enums positive versions setting coordinate uniqueness history uniqueness role relationships and append-only audit protection; representative query paths have intentional indexes.
  - id: AC-F4-READINESS
    statement: API readiness includes a PostgreSQL dependency check while liveness remains process-only; missing or failed database connectivity makes readiness NOT_READY without making liveness DOWN.
  - id: AC-F4-REAL-PROOF
    statement: F4 is not marked PROVEN and currentStage is not advanced to F5 unless migrations adapters concurrency rollback idempotency and readiness execute against an actual PostgreSQL 18 runtime.
  - id: AC-F4-REGRESSION
    statement: Existing F1 F2 F3 and Catalog regression tests continue to pass and memory adapters remain test/reference implementations rather than production persistence authority.
assumptions:
  - statement: PostgreSQL 18 remains the approved TAYMEX database from the governed project profile.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
  - statement: Drizzle PostgreSQL schema declarations are the machine-indexable persistence model truth supported by the current governance verifier; SQL migrations remain the applied database-state history.
    status: verified
    evidence: tooling/schemas/module-manifest.schema.json
  - statement: The current execution environment may lack a runnable PostgreSQL server; absence of runtime evidence is a blocker to PROVEN rather than permission to substitute SQLite or an in-memory database.
