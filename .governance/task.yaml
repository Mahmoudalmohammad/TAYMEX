id: FOUNDATION-F8-PROXY-TYPECHECK-005
title: Repair F8 locale proxy strict typing
mode: fix
risk: R2
objective: >-
  Repair the exact F8 locale proxy TypeScript defect exposed by the Node 24 production build by ensuring the path segment is normalized to a definite string before locale membership checks and request-header propagation, without changing locale behavior, design-system artifacts, capability maturity, or any earlier foundation surface.
baseRevision: bd9ea862e2da8a765cb77d442930d1850593e0a3
