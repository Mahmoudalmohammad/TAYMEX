id: FOUNDATION-F5-001
title: Implement F5 API and security boundary
mode: feature
risk: R3
objective: Implement the first real TAYMEX HTTP boundary on the approved NestJS/Fastify runtime using one canonical OpenAPI
  contract source, generated contract bindings, real PostgreSQL-backed identity/settings/audit composition, authenticated
  actor construction, centralized authorization and AAL enforcement, canonical safe error transport, correlation-aware structured
  request/error logging, bounded input controls, explicit security headers/CORS policy, API abuse protection, and negative
  HTTP tests without expanding product functionality or weakening F0-F4 guarantees.
