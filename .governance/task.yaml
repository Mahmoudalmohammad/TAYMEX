id: FOUNDATION-F5-CLOSURE-002
title: Close F5 from real Node 24, PostgreSQL 18, and HTTP security proof
mode: fix
risk: R3
objective: >-
  Close F5 from the externally executed canonical runtime proof at TAYMEX revision 36602be3b40314f2b7aee8265b5fce13663a3d90, record the real Node 24/pnpm 11/PostgreSQL 18 HTTP evidence, promote only the architecture/API/identity/authorization/settings/audit/observability/security capabilities actually proven by that evidence, keep later performance/UI/operations/remote-merge obligations visible, make stage-regression verifiers compatible with lawful progression beyond F5, and advance the foundation sequence to F6 without modifying the proven runtime implementation or weakening trust-root controls.
baseRevision: 36602be3b40314f2b7aee8265b5fce13663a3d90
modules:
  - application-foundation
  - api-foundation
  - identity
  - settings-runtime
  - audit
  - observability
scope:
  allowedPaths:
    - .governance/task.yaml
    - blueprints/foundation/foundation.manifest.yaml
