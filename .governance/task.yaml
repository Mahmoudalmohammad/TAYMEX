id: PLATFORM-202
title: Adopt explicit settings precedence and settings runtime artifact
mode: platform-change
risk: R4
objective: Upgrade the TAYMEX consumer governance contract to require explicit per-setting precedence and add the versioned platform settings runtime artifact needed by the Products slice, without changing unrelated product behavior.
baseRevision: 078bcd98d7252b8a4c73c1a4842463139818b90d
modules:
  - catalog
scope:
  allowedPaths:
    - tooling/schemas/settings-registry.schema.json
    - tooling/registry/settings.registry.yaml
    - .platform/artifacts/governance/**
    - .platform/governance.lock.yaml
    - .platform/artifacts/runtime/engineering-platform-settings-0.1.0.tgz
    - .platform/runtime.lock.yaml
    - apps/api/package.json
    - .governance/task.yaml
  forbiddenPaths:
    - .github/**
    - tooling/trust-root/**
    - tooling/registry/rules.registry.yaml
    - apps/web/**
  allowNewFiles: true
  allowedNewFiles:
    - .platform/artifacts/governance/engineering-platform-governance-0.1.1.tar.gz
    - .platform/artifacts/runtime/engineering-platform-settings-0.1.0.tgz
    - .governance/task.yaml
  allowDependencies: true
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: true
  allowArchitectureChanges: false
  allowControlPlaneChanges: true
  allowTrustRootChanges: true
acceptance:
  - id: AC-PRECEDENCE
    statement: Every OVERRIDE or REPLACE setting must declare explicit precedence containing exactly its allowed scopes.
  - id: AC-SETTINGS-ARTIFACT
    statement: TAYMEX consumes @engineering-platform/settings 0.1.0 through a locked versioned artifact rather than platform source.
  - id: AC-GOVERNANCE-UPGRADE
    statement: The trusted governance verifier artifact is upgraded immutably from 0.1.0 to 0.1.1 and its hash is verified.
  - id: AC-RUNTIME-HONESTY
    statement: catalog.products.defaultPageSize is marked restart until a real hot-reload settings store exists.
assumptions:
  - statement: The Products slice requires only platform and project setting scopes with OVERRIDE semantics.
    status: verified
    evidence: docs/slices/products/PRODUCTS_VERTICAL_SLICE_V0.md
obligations:
  securityDelta: required
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: considered
  idempotency: not-applicable
functional:
  invariants:
    - Product feature tasks cannot modify governance schemas or governance artifacts after this upgrade.
    - Explicit precedence is setting-specific and no universal precedence chain is invented.
  edgeCases:
    - precedence omits an allowed scope
    - precedence includes a forbidden scope
    - governance artifact hash mismatch
  failureModes:
    - Consumer validation fails closed if registry and schema disagree.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - RISK-001
  - TRUST-001
  - AUTH-001
