acceptance:
  - id: AC-F8-SSR-UNIT-SANCTIONED
    statement: The F8 representative Intl.NumberFormat unit sample uses an ECMA-402 sanctioned unit identifier and no longer throws during Node 24 server rendering for AR, TR, or EN.
  - id: AC-F8-SOLAR-UNIT-BOUNDARY
    statement: Solar engineering units such as W, kW, Wh, and kWh remain owned by the existing canonical TAYMEX quantity/unit primitives; this repair does not invent an Intl alias, conversion, duplicate unit registry, or solar calculation behavior.
  - id: AC-F8-RUNTIME-REGRESSION-GATE
    statement: The existing production build and exact-SHA Chromium/CDP proof remain the runtime regression gates; no local workaround, dependency, fallback renderer, or browser-only bypass is introduced.
assumptions:
  - statement: R8 passed sections 1 through 9 and failed first in section 10 when SSR evaluated Intl.NumberFormat with unit kilowatt on the /ar/foundation/ui proof route.
    status: verified
    evidence: F8 local validation R8 first-failure report and web-process.log from 2026-08-30T091348Z.
  - statement: ECMAScript Internationalization specifies a limited sanctioned set of unit identifiers for Intl.NumberFormat unit style; kilowatt is not in that set while celsius is.
    status: verified
    evidence: ECMA-402 measurement-unit identifiers and Node 24 R8 runtime evidence.
