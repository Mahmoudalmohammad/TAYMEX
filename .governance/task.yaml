acceptance:
  - id: AC-F7-MEDIA-BOUNDARY
    statement: Media bytes are accepted only through one provider-neutral storage boundary; user-controlled names never become filesystem paths or storage keys, path-like original names are rejected, extension/MIME/content must agree, upload size is bounded before persistence, stored bytes have SHA-256 integrity metadata, stored metadata is validated on read, and private download/delete require explicit authorization.
  - id: AC-F7-MEDIA-SANITIZATION
    statement: The supported image path validates container structure and CRC/dimension bounds where applicable, decodes and re-encodes through one pinned image decoder without copying embedded metadata, writes activity through the existing audit contract, compensates a stored upload when required audit persistence fails, restores a deleted object when required delete audit persistence fails, and rejects malformed or unsupported content rather than storing it under a trusted media type.
  - id: AC-F7-EVENT-REGISTRY
    statement: Transactional notification side effects use an event declared in the canonical event registry with generated typed bindings; unregistered or incorrectly classified delivery events cannot be enqueued through the F7 runtime path.
  - id: AC-F7-TRANSACTIONAL-OUTBOX
    statement: Password-reset and email-verification secret-delivery requests enqueue encrypted outbox records inside the same PostgreSQL transaction as challenge creation and the corresponding identity event; no external provider I/O occurs inside that transaction.
  - id: AC-F7-OUTBOX-SAFETY
    statement: Outbox processing uses bounded batches, database leasing with SKIP LOCKED semantics, retry scheduling, terminal dead-letter state, opaque error codes, and provider idempotency keys; plaintext secrets are absent from persisted outbox columns and logs.
  - id: AC-F7-NO-BROKER-FRAMEWORK
    statement: F7 does not introduce Kafka RabbitMQ Redis queues BullMQ a generalized worker framework or a multi-provider storage ecosystem; the database outbox and filesystem proof adapter exist only to establish the required foundation contracts.
  - id: AC-F7-REAL-PROOF
    statement: F7 remains IMPLEMENTED and currentStage remains F7 until media filesystem behavior and PostgreSQL 18 migration outbox concurrency retry encryption and transactional rollback execute against the exact committed F7 implementation revision on Node 24 and pnpm 11.24.
  - id: AC-F7-REGRESSION
    statement: F0-F6 verifiers package tests governance trust consumer-boundary and handoff remain passing without weakening prior gates or changing the frozen Catalog feature slice.
assumptions:
  - statement: PostgreSQL 18 remains the approved durable store for the transactional outbox and no broker is required to prove the current F7 side-effect boundary.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
  - statement: The existing identity password-reset and email-verification delivery seam is the smallest real side-effect path that can pressure-test transactional durability without resuming product feature expansion.
    status: verified
    evidence: packages/identity/src/authentication.ts
  - statement: Initial secure media proof may intentionally support a narrow image allowlist rather than claiming safe handling of arbitrary active document formats before a governed scanner/sanitizer exists.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
obligations:
  securityDelta: completed
  performance: standard
