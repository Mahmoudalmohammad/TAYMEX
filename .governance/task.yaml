id: FOUNDATION-F1-001
title: Implement core application contracts and integrate them into TAYMEX
mode: feature
risk: R2
objective: Implement the F1 application foundation as framework-neutral core contracts for canonical errors and validation, deterministic clock/time, exact money/currency, typed quantities/units, and localization primitives, then integrate those contracts into the existing Catalog and web localization paths without expanding product functionality.
baseRevision: dd6243ff1f06dcde86553fa66258e8777d4fa599
modules:
  - catalog
scope:
  allowedPaths:
    - .governance/task.yaml
    - packages/foundation/**
    - apps/api/package.json
    - apps/web/package.json
    - apps/api/src/modules/catalog/domain/product.ts
    - apps/api/src/modules/catalog/application/catalog-products-service.ts
    - apps/api/src/generated/locales.generated.ts
    - apps/web/src/i18n/locales.generated.ts
    - apps/web/src/i18n/locales.ts
    - scripts/generate-localization-bindings.py
    - blueprints/foundation/foundation.manifest.yaml
  forbiddenPaths:
    - apps/api/src/modules/catalog/application/catalog-product-repository.ts
    - apps/api/src/modules/catalog/catalog.module.ts
    - apps/api/src/modules/catalog/tests/**
    - apps/web/app/**
    - tooling/**
    - .platform/**
    - .github/**
  allowNewFiles: true
  allowedNewFiles:
    - packages/foundation/**
    - apps/api/src/generated/locales.generated.ts
    - apps/web/src/i18n/locales.generated.ts
    - scripts/generate-localization-bindings.py
  allowDependencies: true
  allowedDependencies:
    - '@taymex/foundation'
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: true
acceptance:
  - id: AC-F1-ERRORS
    statement: Canonical application errors separate machine code/category and safe client descriptors from internal messages, and validation primitives produce structured field issues.
  - id: AC-F1-TIME
    statement: Application code can depend on a Clock abstraction with deterministic fixed-clock tests and explicit UTC serialization helpers rather than reading wall-clock time directly.
  - id: AC-F1-MONEY
    statement: Money never uses binary floating point, validates currency/decimal precision, rejects incompatible currencies, and has explicit deterministic rounding modes with tests.
  - id: AC-F1-UNITS
    statement: Quantity values are decimal strings with canonical unit identifiers and exact compatible conversions while incompatible dimensions fail explicitly.
  - id: AC-F1-LOCALIZATION
    statement: AR/TR/EN locale bindings are generated from the project profile, directionality and bidi helpers are centralized, and locale-aware number/currency/time formatting has deterministic contract tests.
  - id: AC-F1-INTEGRATION
    statement: Catalog Product validation/money/errors and application clock/errors consume F1 contracts without changing Product feature scope or persisted field names.
  - id: AC-F1-FOUNDATION
    statement: Foundation manifest records F1 evidence and advances the current stage only to the next foundation stage after F1 checks pass.
assumptions:
  - statement: Product priceAmount and priceCurrency remain the current Catalog domain fields; F1 standardizes their validation and behavior without introducing a new persistence model.
    status: verified
    evidence: apps/api/src/modules/catalog/domain/product.ts
  - statement: Enabled locales and RTL locales are controlled by the canonical TAYMEX project profile.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
  - statement: F1 introduces no database, HTTP, identity, settings-administration, audit, or product-feature expansion.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
obligations:
  securityDelta: not-applicable
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Internal error messages are not automatically exposed as client-safe error text.
    - Monetary arithmetic never converts decimal business amounts through JavaScript Number.
    - Unit conversion is permitted only between units of the same physical dimension.
    - Locale bindings cannot silently diverge from the project profile.
    - Clock consumers receive cloned Date values so mutable Date objects cannot mutate clock state.
  edgeCases:
    - Decimal values with leading zeros, trailing fractional zeros, excessive precision, and negative values.
    - HALF_UP and HALF_EVEN rounding at exact midpoint values.
    - Currency mismatch during addition/comparison.
    - Incompatible unit conversion such as power to energy.
    - Unknown locale and mixed-direction dynamic text.
  failureModes:
    - Product retains a private duplicate money validator after canonical money integration.
    - Catalog service keeps its own clock contract instead of consuming the foundation Clock.
    - Generated locale bindings become stale after project-profile changes.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - ARCH-001
  - RISK-001
  - TRUST-001
