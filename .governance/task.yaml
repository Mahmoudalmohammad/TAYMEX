id: FOUNDATION-F9-BACKUP-RESTORE-RECOVERY-012
title: Implement F9 backup, restore and recovery authority baseline and real PostgreSQL 18 drill
mode: security-change
risk: R4
objective: >-
  Establish one executable F9 Recovery Authority for database backup, restore, SHA-256 integrity, encryption, and failure domain separation; prove real PostgreSQL 18 backup, isolated destination restore, schema/data/trigger verification, and negative tamper/checksum rejection without claiming unverified cloud or RPO/RTO SLA readiness; advance only operations.backup-restore from DESIGNED to IMPLEMENTED; and integrate recovery verification into governance CI.
