id: FOUNDATION-F9-PRODUCTION-DELIVERY-AUTHORITY-011
title: Implement F9 production and delivery authority baseline
mode: security-change
risk: R4
objective: >-
  Establish one executable F9 authority for remote merge protection, deployment environments, secret delivery, exact artifact identity, migration sequencing and rollback semantics without falsely claiming remote or production proof; wire the verifier into governance CI; advance only operations.environment-secrets-delivery from DESIGNED to IMPLEMENTED; and keep external merge/deployment activation explicitly pending until real remote identities and a deployment provider exist.
baseRevision: 56a64a8c406e13d36343c05bd3d473076bc86401
modules:
  - application-foundation
scope:
  allowedPaths:
    - .governance/task.yaml
    - .github/workflows/governance.yml
    - .github/rulesets/README.md
    - blueprints/foundation/foundation.manifest.yaml
    - operations/f9/production-delivery.authority.yaml
    - scripts/verify-f9-production-delivery.py
    - docs/FOUNDATION_F9_PRODUCTION_DELIVERY_AUTHORITY_BASELINE.md
    - package.json
  forbiddenPaths:
    - .github/workflows/trust-root.yml
    - .github/CODEOWNERS
    - tooling/trust-root/**
    - tooling/schemas/trust-root.schema.json
    - .platform/**
    - apps/**
    - packages/**
    - contracts/**
    - pnpm-lock.yaml
  allowNewFiles: true
  allowedNewFiles:
    - operations/f9/production-delivery.authority.yaml
    - scripts/verify-f9-production-delivery.py
    - docs/FOUNDATION_F9_PRODUCTION_DELIVERY_AUTHORITY_BASELINE.md
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
  allowVisualBaselineChanges: false
  allowBreakingContractChanges: false
  allowDestructiveMigrations: false
  allowControlPlaneChanges: true
  allowTrustRootChanges: false
acceptance:
  - id: AC-F9-AUTHORITY-SINGLE
    statement: One machine-readable authority owns remote merge requirements, deployment profiles, secrets, artifact promotion, migrations and rollback, and the verifier rejects contradictory or falsely activated state.
  - id: AC-F9-REMOTE-FAIL-CLOSED
    statement: Remote merge authority remains explicitly pending while repository coordinates and real CODEOWNERS identities are unavailable; activation requires ruleset, required-check and red-team evidence.
  - id: AC-F9-SECRETS
    statement: Secret values are forbidden from repository, generated agent context, normal logs and configuration exports; long-lived cloud credentials are forbidden and OIDC short-lived authentication is required when supported by the selected provider.
  - id: AC-F9-DELIVERY
    statement: Delivery is defined as build once and promote the same exact-SHA artifact, with explicit migration, readiness, smoke and schema-compatible rollback rules.
  - id: AC-F9-CI
    statement: Governance CI contains a dedicated f9-production-delivery job that executes the F9 authority verifier without modifying the trust-root workflow.
  - id: AC-F9-MATURITY
    statement: Only operations.environment-secrets-delivery advances to IMPLEMENTED; remote trust remains INTEGRATED and no F9 capability is promoted to PROVEN without real external evidence.
assumptions:
  - statement: R12 is the reviewed F8-closed F9-ready canonical baseline at TAYMEX 56a64a8c406e13d36343c05bd3d473076bc86401.
    status: verified
    evidence: blueprints/foundation/foundation.manifest.yaml
  - statement: The current archive does not contain a real TAYMEX GitHub remote identity and therefore external merge authority cannot be proven locally.
    status: verified
    evidence: docs/FOUNDATION_F9_PRODUCTION_DELIVERY_AUTHORITY_BASELINE.md
  - statement: No cloud deployment provider has been selected, so staging and production deployment activation must remain pending rather than being guessed.
    status: verified
    evidence: operations/f9/production-delivery.authority.yaml
obligations:
  securityDelta: required
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: required
functional:
  invariants:
    - Local verifier success cannot be used as evidence that GitHub merge protection or a production deployment is active.
    - Secret values never become application Settings or repository configuration values.
    - A released artifact is identified by exact Git SHA and SHA-256 and is not rebuilt differently per environment.
    - Product feature expansion remains blocked while required F9 capabilities are below exit maturity.
  statesAndTransitions:
    - F9 authority missing -> IMPLEMENTED_LOCAL_BASELINE only after machine-readable contract and verifier are committed.
    - PENDING_REAL_REMOTE -> activated only after repository identity ruleset required checks code owners and red-team evidence exist.
    - PENDING_PROVIDER_SELECTION -> deployment activated only after an explicit provider/profile and protected environment are selected and proven.
  edgeCases:
    - a placeholder CODEOWNERS identity must prevent an activated remote-trust claim
    - a deployment provider must not be inferred from local Docker or PostgreSQL proof
    - an application rollback after a migration is blocked unless schema compatibility is known
  failureModes:
    - treating repository workflow files as proof that remote branch rules are active
    - storing cloud access keys as long-lived repository or GitHub secrets when OIDC is available
    - rebuilding different application artifacts for staging and production
    - destructive schema rollback without verified recovery evidence
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
  - MODEL-001
  - DATA-001
