acceptance:
  - id: AC-F9-RECOVERY-AUTHORITY
    statement: One machine-readable Recovery Authority defines database backup, isolated restore, SHA-256 integrity, encryption, least-privilege roles, PITR requirements, and BIA-governed RPO/RTO status.
  - id: AC-F9-POSTGRES18-DRILL
    statement: A deterministic backup-and-restore drill executes on real PostgreSQL 18 against an isolated clean destination database, validating migration history, table definitions, fixture data, append-only triggers, and database readiness.
  - id: AC-F9-INTEGRITY-NEGATIVE-PROOF
    statement: SHA-256 checksum mismatch on a mutated/tampered backup archive strictly rejects the restore candidate before any restore attempt.
  - id: AC-F9-NO-SECRETS-LEAKED
    statement: Database credentials, connection passwords, and sensitive records are strictly redacted from logs, evidence, and manifests.
  - id: AC-F9-OBSERVATION-METRICS
    statement: Durations and byte sizes for backup, restore, and verification are recorded as observation baselines without inventing arbitrary production SLA gates.
  - id: AC-F9-MATURITY-BOUNDED
    statement: Only operations.backup-restore advances from DESIGNED to IMPLEMENTED with explicit remaining items for production cloud provider and PITR proof.
assumptions:
  - statement: R13 is the reviewed F9-001 implemented canonical baseline at TAYMEX fc767c623e94c9f1afc33c1685fb2a4a7efbba09.
    status: verified
    evidence: blueprints/foundation/foundation.manifest.yaml
  - statement: Production RPO and RTO targets require a formal Business Impact Analysis and must remain PENDING_BIA rather than being estimated.
    status: verified
    evidence: operations/f9/recovery.authority.yaml
  - statement: Real cloud backup storage and continuous WAL archiving providers are not provisioned in this local environment and remain PENDING_PROVIDER_SELECTION.
    status: verified
    evidence: operations/f9/recovery.authority.yaml
obligations:
  securityDelta: required
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: required
functional:
  invariants:
    - A backup archive is not considered recoverable until proven through a verified restore drill on an isolated clean database.
    - Checksum verification is mandatory before executing restore.
    - Restoring over the active source database is strictly forbidden.
    - Database triggers and constraints must remain fully active and enforced in the restored database.
  statesAndTransitions:
    - Recovery authority missing -> IMPLEMENTED_LOCAL_BASELINE only after machine-readable contract and verifiers are committed.
    - DESIGNED -> IMPLEMENTED for operations.backup-restore upon successful local PostgreSQL 18 drill and negative proof.
    - IMPLEMENTED -> PROVEN requires real cloud provider, continuous WAL streaming/PITR, and BIA-approved RPO/RTO.
  edgeCases:
    - corrupted or tampered backup files must fail checksum verification and abort restore preflight
    - missing encryption or checksum requirements in the authority must cause the verifier to fail
    - premature claim of PROVEN maturity must be rejected by the recovery verifier
  failureModes:
    - relying on pg_dump exit code alone without testing database restore
    - restoring into the live production database instead of an isolated target
    - hardcoding speculative RPO/RTO SLA numbers before business agreement
    - exposing database passwords or connection secrets in test logs or manifests
requiredGates:
