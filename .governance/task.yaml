id: PRODUCT-004
title: Enforce Products read and manage permissions
mode: feature
risk: R3
objective: Generate typed Products permission bindings from the canonical permission registry and enforce catalog.products.read/manage through the versioned platform authorization primitive, with explicit positive and negative tests and no role-name hardcoding.
baseRevision: ff3775c4a7b75c1c5619c9825d80961f93d8f2ee
modules:
  - catalog
scope:
  allowedPaths:
    - scripts/generate-permission-bindings.py
    - apps/api/src/generated/permissions.generated.ts
    - apps/api/src/modules/catalog/application/catalog-products-authorization.ts
    - apps/api/src/modules/catalog/tests/catalog-products-authorization.test.ts
    - package.json
    - .governance/task.yaml
  forbiddenPaths:
    - tooling/**
    - .github/**
    - .platform/**
    - apps/web/**
  allowNewFiles: true
  allowedNewFiles:
    - scripts/generate-permission-bindings.py
    - apps/api/src/generated/permissions.generated.ts
    - apps/api/src/modules/catalog/application/catalog-products-authorization.ts
    - apps/api/src/modules/catalog/tests/catalog-products-authorization.test.ts
    - .governance/task.yaml
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
acceptance:
  - id: AC-PERMISSION-TRUTH
    statement: Product permission constants are generated from tooling/registry/permissions.registry.yaml and stale output is detectable.
  - id: AC-READ
    statement: Product read behavior requires catalog.products.read and denies a subject without it.
  - id: AC-MANAGE
    statement: Product create/edit/status behavior requires catalog.products.manage and denies a subject without it.
  - id: AC-NO-ROLE-HARDCODE
    statement: Authorization does not infer privileges from role names or subject identifiers.
assumptions:
  - statement: Products v0 permissions are global and resource/tenant authorization is out of scope for this slice.
    status: verified
    evidence: tooling/registry/permissions.registry.yaml
obligations:
  securityDelta: completed
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Only canonical generated permission keys are used by Catalog authorization adapters.
    - Missing permission always denies; role-like subject identifiers grant nothing.
  edgeCases:
    - subject has read but not manage
    - subject has manage but not read
    - subject id equals admin but permissions are empty
    - generated permission binding becomes stale
  failureModes:
    - Missing permission throws the canonical AuthorizationDeniedError from the platform runtime artifact.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
  - AUTH-001
