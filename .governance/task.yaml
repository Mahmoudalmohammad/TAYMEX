  accessibility: not-applicable
  concurrency: tested
  idempotency: tested
  events:
    - notification.secret-delivery.requested
functional:
  invariants:
    - Original filenames and request MIME values are metadata only and never determine trusted content type or storage path.
    - Unsupported or malformed uploads fail before durable storage; partial filesystem writes are cleaned up.
    - Private media cannot be downloaded or deleted without an explicit authorization decision.
    - Secret-delivery plaintext is encrypted before durable outbox persistence and is never written to logs or error text.
    - Outbox enqueue participates in the active identity transaction; provider delivery occurs only after a separate claim step outside the originating transaction.
    - A dedupe key uniquely represents one secret-delivery request and provider calls receive the same stable idempotency key on retry.
    - Retry count and claim batch size are bounded; poison deliveries become DEAD rather than retrying forever.
    - No F7 implementation creates a broker abstraction hierarchy public CDN path generic scheduler or product-specific notification matrix.
    - F7 proof is tied to the exact committed implementation SHA and does not inherit PostgreSQL proof from F6.
  statesAndTransitions:
    - Media upload transitions VALIDATING to STORED only after byte validation sanitization integrity hashing and provider persistence succeed.
    - Media object transitions STORED to DELETED only through authorized cleanup.
    - Outbox record transitions PENDING to PROCESSING to DELIVERED, or PROCESSING back to PENDING with a future availability time, or to DEAD after the bounded retry limit.
    - F7 implementation pending -> F7 IMPLEMENTED after structural and unit-capable gates; F7 IMPLEMENTED -> F7 PROVEN/CLOSED only after exact-SHA Node 24 pnpm 11.24 PostgreSQL 18 and filesystem proof is returned and reviewed.
  edgeCases:
    - filename attempts path traversal while content is otherwise valid
    - declared MIME disagrees with magic bytes
    - image contains removable metadata or malformed segment/chunk lengths
    - storage provider fails after temporary write starts
    - two processors race to claim the same outbox message
    - provider succeeds but delivery acknowledgement races with lease expiry
    - provider repeatedly fails until the dead-letter threshold
    - duplicate secret-delivery enqueue uses the same dedupe key
    - originating identity transaction rolls back after outbox enqueue is attempted
  failureModes:
    - trusting extension or Content-Type without inspecting bytes
    - storing uploads under user-controlled paths or public web roots
    - persisting plaintext reset or verification secrets in the outbox
    - performing provider network I/O inside the identity database transaction
    - infinite retries or unbounded outbox claims
    - weakening existing verifiers or bypassing transactionality to obtain PASS
    - expanding F7 into a generalized queue broker storage CDN or background-jobs platform
