id: FOUNDATION-F6-HYGIENE-002
title: Keep F6 local validation repository-clean after TypeScript checks
mode: fix
risk: R1
objective: >-
  Repair the repository-hygiene defect exposed by exact-SHA F6 local validation: TypeScript incremental checking may emit tsconfig.tsbuildinfo in the web workspace, so classify TypeScript build metadata as generated and untracked without changing runtime code, application behavior, performance policy, dependencies, migrations, contracts, platform controls, or trust-root sources.
baseRevision: 10c961c0f70b60b130b8ab6912d929edde90ae6b
modules:
  - application-foundation
scope:
  allowedPaths:
    - .gitignore
    - .governance/task.yaml
  forbiddenPaths:
    - .github/**
    - tooling/**
    - .platform/**
    - apps/**
    - packages/**
    - contracts/**
    - blueprints/**
    - docs/**
    - package.json
    - pnpm-lock.yaml
  allowNewFiles: false
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
  allowVisualBaselineChanges: false
  allowBreakingContractChanges: false
  allowDestructiveMigrations: false
  allowControlPlaneChanges: false
  allowTrustRootChanges: false
acceptance:
  - id: AC-F6-HYGIENE-IGNORE
    statement: TypeScript tsbuildinfo metadata generated by build or typecheck is ignored by Git as a compiler artifact rather than deleted by a validation workaround.
  - id: AC-F6-HYGIENE-SCOPE
    statement: The repair changes only repository ignore policy and governed task metadata; runtime code, application configuration, dependencies, migrations, contracts, performance policy, platform controls, and trust-root sources remain unchanged.
  - id: AC-F6-HYGIENE-GOVERNANCE
    statement: The repair diff passes task governance and trust verification as a separate narrow fix based on the previously governed F6 implementation revision.
assumptions:
  - statement: The exact-SHA local validation failure was caused only by apps/web/tsconfig.tsbuildinfo being emitted after successful TypeScript checking.
    status: verified
    evidence: apps/web/tsconfig.json
  - statement: TypeScript build metadata is disposable compiler state and is not a source artifact or runtime contract.
    status: verified
    evidence: apps/web/tsconfig.json
obligations:
  securityDelta: not-applicable
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Local validation must not clean generated TypeScript metadata with a special-case deletion in order to obtain PASS.
    - Ignoring compiler metadata must not broaden into ignoring source, contract, migration, evidence, or runtime configuration files.
    - F6 remains open until PostgreSQL 18 and runtime proof succeeds on the exact final repair SHA.
  statesAndTransitions:
    - F6 implementation at 10c961c0 with local hygiene defect -> repository-hygiene repair committed on top of the same implementation.
    - hygiene repair -> exact-SHA local validation rerun; no F6 closure from structural evidence alone.
  edgeCases:
    - TypeScript writes tsconfig.tsbuildinfo at a workspace root during noEmit typechecking.
    - build and typecheck are rerun repeatedly before the repository cleanliness assertion.
  failureModes:
    - deleting tsconfig.tsbuildinfo in the validation runner to mask an unclassified generated artifact.
    - disabling incremental compilation only to make Git cleanliness pass.
    - broad ignore patterns that could hide source or evidence files.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
  - MODEL-001
  - DATA-001
