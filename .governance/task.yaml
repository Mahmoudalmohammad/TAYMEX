acceptance:
  - id: AC-F7-CLOSURE-EXACT-SHA
    statement: F7 closure evidence is tied to exact TAYMEX revision 9affa751b5a5e3be9820aa1ff530be63fd571a33 and ENGINEERING_PLATFORM revision c3d865ee97f33c7d0247e00fdd02e0c771ea6f98, with Node 24.14.0, pnpm 11.24.0, and PostgreSQL 18.6 / 180006 recorded.
  - id: AC-F7-CLOSURE-MEDIA
    statement: Real temporary-filesystem proof demonstrates the narrow JPEG/PNG media boundary, opaque storage keys, decode/re-encode normalization, integrity verification, authorization and audit behavior, upload/delete compensation, metadata validation, private permissions, and rejection of traversal, extension/MIME/content drift, malformed content, polyglot bytes, and unsupported content.
  - id: AC-F7-CLOSURE-OUTBOX
    statement: Real PostgreSQL 18 proof demonstrates encrypted transactional outbox atomicity, absence of plaintext secret and recipient persistence, SKIP LOCKED claim concurrency, stable provider idempotency, bounded retry/dead-letter behavior, and the declared claim index.
  - id: AC-F7-CLOSURE-NO-FRAMEWORK-EXPANSION
    statement: F7 remains a narrow used-path foundation and does not introduce a generalized broker, queue, worker, scheduler, public-media, CDN, or multi-provider storage framework.
  - id: AC-F7-CLOSURE-RUNTIME
    statement: The exact proven revision passes frozen clean install, build, typecheck, package tests, PostgreSQL 18 migrations and F4/F6 regressions, real F5 HTTP integration, actual API health/readiness smoke, generated checks, and F0-F7 structural verifiers.
  - id: AC-F7-CLOSURE-GOVERNANCE
    statement: Governance, Trust, Consumer Boundary, Handoff, and exact-SHA Git integrity pass on the proven F7 revision.
  - id: AC-F7-CLOSURE-MATURITY
    statement: Only files.media-storage and notifications.events-side-effects are promoted by F7 proof, F7 is closed, the foundation advances only to F8 readiness, and unrelated later capabilities retain their prior maturity and remaining obligations.
  - id: AC-F7-CLOSURE-NONRUNTIME
    statement: The closure diff contains only task metadata, maturity/evidence documentation, and structural verifier updates; no runtime, SQL, dependency, migration, contract, registry, platform, or trust-root implementation changes are introduced after the exact-SHA proof.
assumptions:
  - statement: The operator executed the full F7 validation harness on TAYMEX 9affa751b5a5e3be9820aa1ff530be63fd571a33 with all fourteen sections passing and returned the raw validation ZIP without modifying the tested repository.
    status: verified
    evidence: docs/evidence/F7_FILES_SIDE_EFFECTS_REAL_PROOF.md
  - statement: The returned proof package has SHA-256 d3fe0b65c9361df341248578b9fd5354818af997eb0d755049ea7f0c60f53f72 and records PostgreSQL server_version_num 180006.
    status: verified
    evidence: docs/evidence/F7_FILES_SIDE_EFFECTS_REAL_PROOF.md
  - statement: The accompanying ENGINEERING_PLATFORM revision remains c3d865ee97f33c7d0247e00fdd02e0c771ea6f98.
    status: verified
    evidence: docs/evidence/F7_FILES_SIDE_EFFECTS_REAL_PROOF.md
obligations:
  securityDelta: not-applicable
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: tested
functional:
  invariants:
    - Stage closure is based on real exact-SHA filesystem, PostgreSQL, HTTP, process, governance, trust, and handoff evidence rather than documentation or structural checks alone.
    - The F7 closure commit must not modify the runtime implementation proven at 9affa751b5a5e3be9820aa1ff530be63fd571a33.
    - PASS belongs to the tested SHA and is reusable by the closure commit only because the closure diff is non-runtime and cannot affect proven filesystem, SQL, transaction, encryption, concurrency, HTTP, migration, or provider-boundary behavior.
    - F7 proof does not imply a generalized storage platform, public-media serving, arbitrary-document sanitization, broker/worker runtime, production notification provider, production capacity, remote merge authority, UI/browser proof, or later delivery/recovery proof.
    - Product feature expansion remains blocked until the complete Foundation Readiness Gate passes.
  statesAndTransitions:
    - F7 implemented with exact-SHA real proof pending -> F7 PROVEN and CLOSED only after returned raw evidence is independently reviewed.
    - F7 CLOSED -> currentStage F8 means F8 READY only; it does not mean F8 implementation has started or any F8 capability has been promoted.
  edgeCases:
    - real filesystem proof can expose path, permission, metadata, cleanup, or compensation defects not visible to structural verification
    - PostgreSQL concurrency proof can expose transaction or leasing defects not visible to unit tests
    - provider success followed by acknowledgement failure remains at-least-once and relies on stable provider idempotency rather than pretending exactly-once delivery
    - closure metadata must not be mistaken for a new runtime revision requiring fabricated proof
  failureModes:
    - using proof from an older runtime SHA after a runtime-affecting change
    - promoting unrelated later-stage capabilities because F7 passed
    - broadening the narrow F7 boundaries into generalized broker, worker, storage, or public-media infrastructure
    - weakening encryption, authorization, audit, concurrency, idempotency, governance, trust, or verifiers to transform a failed proof into PASS
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
  - MODEL-001
  - DATA-001
