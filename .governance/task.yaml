acceptance:
  - id: AC-F2-ACCOUNT
    statement: Account identity is separate from credentials sessions roles and product profiles, uses canonical normalized email identity, explicit lifecycle state and optimistic version semantics without framework or database coupling.
  - id: AC-F2-PASSWORD
    statement: Password credentials use a concrete memory-hard Node crypto implementation with explicit policy, salts and versioned encoding; password and reset secrets never appear in errors events sessions or persistent records.
  - id: AC-F2-AUTHENTICATION
    statement: Unknown accounts wrong passwords unavailable accounts and throttled attempts expose one generic authentication failure while internal security events preserve a non-secret reason and unknown accounts still execute password verification work.
  - id: AC-F2-SESSION
    statement: Session issuance stores only a hash of a high-entropy secret and supports authentication expiry rotation current-session revocation logout-all and safe session views with old rotated tokens becoming invalid.
  - id: AC-F2-RECOVERY
    statement: Password reset and email verification challenges are hashed expiring one-time credentials, password reset revokes existing sessions, and requests do not reveal account existence.
  - id: AC-F2-ACTOR
    statement: One authenticated ActorContext carries stable account/session identity explicit assurance role identifiers and resolved permission keys and can be consumed by the canonical authorization primitive without role-name shortcuts.
  - id: AC-F2-ROLES
    statement: Role-to-permission definitions validate permissions against an injected canonical permission catalog, permission union is explicit, unknown permissions fail, and role names such as admin grant nothing by themselves.
  - id: AC-F2-THROTTLE
    statement: Authentication depends on an explicit brute-force throttle contract and test reference implementation with bounded failure window and lock duration; success clears principal failure state.
  - id: AC-F2-EVENTS
    statement: Identity security events are canonical registry entries with generated typed identifiers and emitted payloads exclude passwords raw session tokens raw recovery tokens and credential hashes.
  - id: AC-F2-INTEGRATION
    statement: Catalog authorization inputs consume the F2 ActorContext and all existing Catalog domain application settings and authorization regression tests continue to pass.
  - id: AC-F2-FOUNDATION
    statement: Foundation manifest records only demonstrated F2 evidence and advances implementation sequencing to F3 while preserving later transport persistence audit and remote-security proof as explicit remaining work.
assumptions:
  - statement: TAYMEX account identity uses email as the initial sign-in identifier, while customer employee or other business profiles remain separate domain concerns.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
  - statement: Public self-registration is not required to prove F2 and account provisioning remains an internal application capability until a product flow explicitly requires registration.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
  - statement: PostgreSQL persistence HTTP cookie transport distributed rate limiting MFA implementation audit storage and notification delivery belong to later foundation stages and must not be claimed as proven by F2 in-memory contract tests.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
obligations:
  securityDelta: required
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: considered
  idempotency: required
functional:
  invariants:
    - Raw passwords session secrets reset tokens verification tokens and password hashes never appear in emitted security events or safe views.
    - Account profile data is not embedded into the identity account foundation.
    - Unknown authority defaults to deny and role display names do not grant authority.
    - Session secrets are persisted only as cryptographic hashes and rotated secrets invalidate prior tokens.
    - Password reset and verification challenges are single-use and time-bounded.
    - Authentication failure exposed to callers does not distinguish unknown account wrong password locked throttled or unavailable account states.
  statesAndTransitions:
    - Account status ACTIVE may transition to SUSPENDED or DISABLED; SUSPENDED may return to ACTIVE; DISABLED requires explicit re-enable policy and cannot authenticate while disabled.
    - Active session may rotate or revoke; expired or revoked sessions never authenticate.
    - Recovery and verification challenge may transition from active to consumed or expire; consumed and expired challenges cannot be reused.
  edgeCases:
    - Email case and surrounding whitespace normalize to one canonical identity key.
    - Unknown account sign-in still performs dummy password verification.
    - Wrong password attempts cross the configured throttle threshold.
    - Old session token is presented after successful rotation.
    - Password reset token is reused after successful consumption or after expiry.
    - Account becomes suspended after a session is issued.
    - Role named admin has zero permissions and must still be denied.
    - Role references an unknown permission key.
  failureModes:
    - Identity implementation stores or emits raw credentials or session/recovery secrets.
    - Authentication leaks account existence through different public error codes.
    - Catalog continues accepting ad-hoc AuthorizationSubject instead of the canonical ActorContext.
    - Role name or account identifier grants implicit permissions.
    - F2 claims database atomicity cookie security distributed throttling audit persistence or MFA proof that has not been implemented.
