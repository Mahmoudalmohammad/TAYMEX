id: RUNTIME-001
title: Make TAYMEX API module format explicit ESM
mode: fix
risk: R2
objective: Align the NestJS API package with the ESM-only versioned platform runtime artifacts by declaring ESM explicitly and using NodeNext-compatible relative import specifiers, without changing domain behavior or platform artifacts.
baseRevision: 31a1fdb331801af01cc68828db8fb92af0d58056
modules:
  - catalog
scope:
  allowedPaths:
    - apps/api/package.json
    - apps/api/src/main.ts
    - apps/api/src/app.module.ts
    - apps/api/src/modules/health/health.module.ts
    - apps/api/src/modules/catalog/tests/product.domain.test.ts
    - .governance/task.yaml
  forbiddenPaths:
    - tooling/**
    - .github/**
    - .platform/**
    - apps/web/**
  allowNewFiles: false
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
acceptance:
  - id: AC-ESM
    statement: The API package explicitly declares ESM and TypeScript NodeNext emits ESM for API source files.
  - id: AC-RELATIVE-IMPORTS
    statement: Runtime relative imports in the API use NodeNext-compatible .js specifiers.
  - id: AC-PLATFORM-RUNTIME
    statement: Compiled ESM Catalog code can import the locked @engineering-platform/settings runtime artifact without require/export incompatibility.
  - id: AC-NO-BEHAVIOR-CHANGE
    statement: Existing Product domain behavior and tests remain unchanged apart from import specifier compatibility.
assumptions:
  - statement: The platform settings runtime artifact is intentionally ESM and is already locked in TAYMEX.
    status: verified
    evidence: .platform/runtime.lock.yaml and @engineering-platform/settings package metadata
obligations:
  securityDelta: not-applicable
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - No Product domain behavior changes.
    - No platform artifact or dependency version changes.
  edgeCases:
    - NodeNext relative imports after ESM package declaration
    - ESM-only platform artifact imported by compiled API code
  failureModes:
    - Runtime module format mismatch must fail validation rather than be hidden by a test-only workaround.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
  - AUTH-001
