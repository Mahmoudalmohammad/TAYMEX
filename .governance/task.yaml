id: FOUNDATION-F8-UI-002
title: Implement the TAYMEX F8 UI and UX foundation
mode: feature
risk: R3
objective: >-
  Implement the complete used F8 UI/UX foundation in TAYMEX by consuming only locked platform artifacts, establishing one governed theme and typography profile, correcting document locale direction, finalizing current shell information architecture, proving AR/TR/EN formatting paths, and exercising shared form, table, upload, feedback, navigation, loading, modal, tabs and page-state behavior on one real reference route without creating a second design system or prematurely implementing deferred interaction patterns.
baseRevision: 9b9e8687ed62aa6f931d18a2d74b0597841ce20b
modules:
  - application-foundation
