id: FOUNDATION-F9-OBSERVABILITY-ABUSE-013
title: Establish F9 production observability, diagnostics and deployment abuse protection baseline
mode: security-change
risk: R4
objective: >-
  Expand the canonical production-delivery authority with strict production logging, ISO-8601 UTC timestamps, service/release identity, non-leaking correlation IDs, recursive credential/token/DSN redaction, clear architectural separation of liveness from dependency readiness, and multi-instance edge abuse protection requirements without prematurely claiming unverified cloud telemetry or edge provider capabilities; execute real NestJS/Fastify HTTP runtime verification demonstrating correlation propagation, stack masking, security event logging, zero secrets leaked, and Fastify body limits; and integrate verification into governance CI.
baseRevision: e452a88d061041e376f533f09708aa63882da8c4
modules:
  - application-foundation
scope:
  allowedPaths:
