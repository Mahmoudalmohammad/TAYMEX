functional:
  invariants:
    - Applied migration content is immutable and checksum mismatch blocks startup migration execution.
    - Every transaction commits exactly once on success and rolls back on failure; nested foundation transaction calls never open an independent connection.
    - Optimistic writes modify a row only when its stored version equals expectedVersion and increment exactly once.
    - Audit records are insert-only at both application contract and database trigger levels.
    - Setting current value history row and hot applied-version update can be executed atomically with the corresponding audit append under one outer transaction.
    - Idempotency key reuse with a different request hash is always a conflict and never returns another request result.
    - Database readiness is not inferred from process liveness.
  statesAndTransitions:
    - Idempotency operation transitions ABSENT to IN_PROGRESS to COMPLETED; a completed matching request is replayable and a conflicting payload is rejected.
    - Mutable setting/account/role/session/challenge records transition from version N to N+1 only through an expected-version predicate.
    - Migration state transitions from unapplied to applied exactly once with immutable checksum evidence.
  edgeCases:
    - Two concurrent writers use the same expected version.
    - Duplicate normalized email is inserted concurrently.
    - Challenge is consumed after expiry or after another consumer won the race.
    - Audit append fails after a mutable state write inside an outer transaction.
    - Idempotency claim races for the same key and request hash.
    - Applied migration filename exists with changed contents.
    - Database readiness query throws or exceeds the configured check timeout.
  failureModes:
    - Local code performs read-then-write concurrency checks without a database predicate.
    - Migration runner edits or silently reapplies an existing migration.
    - Audit append is outside the transaction of the privileged write it records.
    - Production persistence falls back to memory when PostgreSQL is unavailable.
    - F4 is marked PROVEN based only on mock SQL executor tests.
