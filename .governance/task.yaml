acceptance:
- id: AC-F5-CONTRACT
  statement: One canonical OpenAPI 3.1 authoring source generates the stamped operational OpenAPI and TypeScript bindings;
    source/output staleness and implemented route/method/status truth are verified.
- id: AC-F5-COMPOSITION
  statement: HTTP identity, roles, settings and audit routes use the real PostgreSQL-backed F2-F4 services through one application
    composition root with no production memory-store fallback.
- id: AC-F5-AUTHN
  statement: Session authentication uses a secure HttpOnly cookie transport, constructs the canonical ActorContext, rejects
    missing/invalid/revoked sessions, and never logs or returns session secrets.
- id: AC-F5-AUTHZ
  statement: Privileged routes enforce canonical generated permissions and required AAL at the shared HTTP authorization boundary
    with positive and negative tests.
- id: AC-F5-ERRORS
  statement: Validation, authentication, authorization, conflict, not-found and unexpected failures map through one safe machine-readable
    error envelope carrying the request correlation ID without leaking internal exception details.
- id: AC-F5-CORRELATION
  statement: Every request receives a valid correlation ID, response propagation and structured request/error logs use the
    same ID, and malformed caller IDs are replaced rather than trusted.
- id: AC-F5-SECURITY
  statement: Security headers, explicit CORS policy, body-size/content-type controls, bounded API rate limiting and anti-cache
    rules for sensitive responses are centralized and covered by negative HTTP tests.
- id: AC-F5-DATA
  statement: A machine-consumable data classification convention is attached to the sensitive HTTP identity/session surface
    and the security verifier rejects unclassified F5 sensitive routes.
- id: AC-F5-GOVERNANCE
  statement: F5 build/tests, generated contract check, structural verifier, repository truth, project profile, consumer boundary,
    task governance and trust-root verification pass on the committed final diff.
assumptions:
- statement: PostgreSQL 18 persistence and transaction guarantees from F4 are the canonical durable stores used by the F5
    composition root.
  status: verified
  evidence: docs/evidence/F4_POSTGRESQL18_PROOF.md
- statement: NestJS 11 with Fastify is the approved API runtime topology for this foundation line.
  status: verified
