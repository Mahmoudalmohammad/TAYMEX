id: PRODUCT-003
title: Consume Products default page-size through canonical Settings Resolver
mode: feature
risk: R2
objective: Generate typed runtime setting bindings from the canonical consumer registry and consume catalog.products.defaultPageSize through @engineering-platform/settings with explicit platform/project precedence and provenance, without adding a second setting definition.
baseRevision: 9e810db94dc6961c9ec285edd5083a812d97b2ee
modules:
  - catalog
scope:
  allowedPaths:
    - scripts/generate-settings-bindings.py
    - apps/api/src/generated/settings.generated.ts
    - apps/api/src/modules/catalog/application/catalog-products-settings.ts
    - apps/api/src/modules/catalog/tests/catalog-products-settings.test.ts
    - package.json
    - .governance/task.yaml
  forbiddenPaths:
    - tooling/**
    - .github/**
    - .platform/**
    - apps/web/**
  allowNewFiles: true
  allowedNewFiles:
    - scripts/generate-settings-bindings.py
    - apps/api/src/generated/settings.generated.ts
    - apps/api/src/modules/catalog/application/catalog-products-settings.ts
    - apps/api/src/modules/catalog/tests/catalog-products-settings.test.ts
    - .governance/task.yaml
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
acceptance:
  - id: AC-SOURCE-OF-TRUTH
    statement: Runtime TypeScript setting definitions are generated from tooling/registry/settings.registry.yaml and stale generated output is detectable.
  - id: AC-RESOLUTION
    statement: catalog.products.defaultPageSize resolves through @engineering-platform/settings using explicit platform then project precedence.
  - id: AC-EXPLAIN
    statement: The Catalog settings adapter can return winning scope source and version provenance.
  - id: AC-BOUNDS
    statement: Values outside the governed 1 through 100 range fail rather than reaching pagination code.
  - id: AC-NO-HARDCODE
    statement: Catalog application code does not duplicate the literal default 25 or implement its own fallback chain.
assumptions:
  - statement: "@engineering-platform/settings 0.1.0 is a locked TAYMEX runtime artifact, the API is ESM-compatible, and the consumer registry is schema-valid."
    status: verified
    evidence: PLATFORM-202 and RUNTIME-001 verification plus .platform/runtime.lock.yaml
obligations:
  settings:
    - catalog.products.defaultPageSize
  securityDelta: not-applicable
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Canonical registry remains the only setting definition source.
    - Project value may override platform value only because this setting explicitly declares that precedence.
    - Missing scoped values fall back to the registry default.
  edgeCases:
    - project override absent
    - both platform and project values populated
    - out of range value
    - generated binding stale after registry change
  failureModes:
    - Resolver returns a stable settings error rather than silently clamping an invalid configured value.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
  - AUTH-001
