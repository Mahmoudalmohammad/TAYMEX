id: PLATFORM-205
title: Permit consumer-local workspace packages while preserving platform artifact isolation
mode: platform-change
risk: R4
objective: Upgrade the trusted governance artifact so TAYMEX may use workspace dependencies for its own internal packages while continuing to reject workspace, link, source-path, or tampered consumption of engineering-platform artifacts.
baseRevision: 2aea0dfbfdd3e570cb00b39c0494ec226dba981e
modules:
  - catalog
scope:
  allowedPaths:
    - .governance/task.yaml
    - .platform/governance.lock.yaml
    - .platform/artifacts/governance/engineering-platform-governance-0.1.3.tar.gz
  forbiddenPaths:
    - apps/**
    - packages/**
    - tooling/**
    - blueprints/**
  allowNewFiles: true
  allowedNewFiles:
    - .platform/artifacts/governance/engineering-platform-governance-0.1.3.tar.gz
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
  allowControlPlaneChanges: true
  allowTrustRootChanges: true
acceptance:
  - id: AC-LOCAL-WORKSPACE
    statement: TAYMEX-owned workspace dependencies remain inside the independent consumer repository and are not rejected by the platform artifact boundary.
  - id: AC-PLATFORM-ISOLATION
    statement: Any engineering-platform dependency using workspace, link, source path, missing lock, or invalid artifact integrity remains blocked.
assumptions:
  - statement: TAYMEX is an independent monorepo and may legitimately contain its own internal packages under packages/*.
    status: verified
    evidence: pnpm-workspace.yaml
obligations:
  securityDelta: completed
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - Consumer-local package composition must not weaken the versioned artifact boundary for @engineering-platform packages.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
