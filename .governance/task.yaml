functional:
  invariants:
  - No HTTP controller may construct its own identity, authorization, settings, audit or observability implementation.
  - Session secrets are transported only by the canonical secure cookie mechanism and are never persisted or emitted in plaintext
    logs/audit records.
  - Authorization denial is fail-closed; absence of actor, permission or required assurance never falls through to the handler.
  - OpenAPI/generated contract truth must fail when routes drift rather than becoming descriptive documentation.
  - F5 does not modify F4 migrations or weaken exact optimistic version transitions.
  statesAndTransitions:
  - unauthenticated request -> authenticated ActorContext only after canonical session validation.
  - authenticated AAL1 actor -> privileged handler only when permission and assurance requirements are satisfied.
  - F5 current -> F6 only after real HTTP positive/negative proof and governance pass.
  edgeCases:
  - malformed or oversized correlation ID
  - missing, malformed, expired or revoked session cookie
  - credential stuffing against sign-in route
  - CORS request from disallowed origin
  - oversized JSON body or unsupported content type
  - privileged actor has permission but insufficient AAL
  - sensitive route accidentally cacheable
  - internal exception contains database or secret detail
  failureModes:
  - duplicating authorization checks inside individual controllers
  - trusting X-Forwarded-For without an explicit proxy policy
  - using wildcard CORS with credential cookies
  - exposing raw exception messages or stack traces
  - using in-memory authentication throttling as a multi-instance production guarantee
