acceptance:
  - id: AC-F6-QUERY-INSTRUMENTATION
    statement: PostgreSQL application queries can be observed through one reusable instrumentation hook that records operation, stable statement fingerprint, parameter count, result count and outcome without recording parameter values or wall-clock latency.
  - id: AC-F6-DETERMINISTIC-GATE
    statement: Routine F6 verification blocks on deterministic query-count, repeated-fingerprint, bounded-list and source/configuration checks rather than environment-sensitive p95/p99 latency thresholds.
  - id: AC-F6-NPLUS1
    statement: A PostgreSQL 18 integration proof demonstrates that representative multi-row list access stays within its declared query budget and does not amplify queries per returned row.
  - id: AC-F6-QUERY-PLAN
    statement: The PostgreSQL 18 proof includes EXPLAIN JSON evidence for a representative selective ordered query and verifies that the intended existing index is usable; no new index is added merely to force the test to pass.
  - id: AC-F6-MATURITY
    statement: F6 remains current and performance.query-runtime is not promoted to PROVEN until real Node 24/pnpm 11.24/PostgreSQL 18 evidence is captured against the exact committed F6 revision.
  - id: AC-F6-GOVERNANCE
    statement: The committed F6 diff passes F0-F5 regressions, the F6 verifier, task governance, trust-root verification, consumer boundary verification and handoff verification without modifying protected platform/control-plane sources.
assumptions:
  - statement: PostgreSQL 18 remains the only database version that can satisfy the real F6 database proof; mocks or an older PostgreSQL version do not satisfy AC-F6-NPLUS1 or AC-F6-QUERY-PLAN.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
  - statement: Product/Catalog feature expansion remains frozen during F6; representative performance proof uses already-established foundation persistence paths rather than creating Product persistence early.
    status: verified
    evidence: blueprints/foundation/foundation.manifest.yaml
  - statement: No universal response-time SLO is invented for ordinary PR CI; latency percentiles belong to stable runtime/staging evidence when a critical journey is declared.
    status: verified
    evidence: TAYMEX_CUMULATIVE_EXPERT_REVIEW.md
obligations:
  securityDelta: completed
  performance: critical-budget
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: considered
  idempotency: not-applicable
functional:
  invariants:
    - Performance instrumentation never records SQL parameter values or credentials.
    - Query-count budgets are deterministic and attached to representative access paths rather than arbitrary global latency numbers.
    - Lists exposed by foundation/application paths remain bounded before database access.
    - No F6 repair introduces a Product persistence adapter, migration, dependency, cache layer, queue, or unrelated architecture expansion.
    - Real PostgreSQL proof is tied to the exact committed F6 implementation revision.
  statesAndTransitions:
    - F6 implementation pending -> F6 locally verified only after deterministic structural/unit-capable checks and governance pass.
    - F6 locally verified -> F6 PROVEN/F7 only after exact-revision Node 24/pnpm 11.24/PostgreSQL 18 proof is recorded in a separate closure task.
  edgeCases:
    - query fails after instrumentation start
    - observer sees repeated identical statement fingerprints
    - list contains many rows but must not issue per-row queries
    - PostgreSQL planner chooses a different physical node while the intended index remains a valid plan path
  failureModes:
    - using wall-clock p95/p99 timing as an ordinary blocking PR gate in an unstable runner
    - logging SQL parameter values through performance telemetry
    - weakening query budgets or forcing a fake index solely to obtain PASS
    - adding Product persistence before the foundation freeze is lifted
    - promoting F6 maturity from structural evidence alone
requiredGates:
