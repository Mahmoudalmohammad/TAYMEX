acceptance:
  - id: AC-REVIEW-CONTEXT
    statement: The supplied problem context and cumulative expert review are preserved verbatim in the repository root and are classified as non-authoritative evidence/context rather than executable policy.
  - id: AC-REVIEW-TRUTH
    statement: SQL migration applied-state truth, Drizzle model truth, module ownership, and repository truth have an explicit conflict policy and automated parity evidence; disagreement blocks review closure.
  - id: AC-REVIEW-TRANSACTION
    statement: Failed rollback never returns an unknown PostgreSQL connection to the pool as reusable and the migration runner applies the same safety rule.
  - id: AC-REVIEW-MIGRATION
    statement: Invalid migration filenames, deleted applied migrations, filename drift, and checksum drift are all rejected rather than silently ignored.
  - id: AC-REVIEW-IDEMPOTENCY
    statement: Idempotency claims use a fencing token so an expired/stale worker cannot complete a later reclaimed claim for the same operation and key.
  - id: AC-REVIEW-IDENTITY
    statement: Identity and role optimistic writes enforce exact N-to-N+1 transitions, initial persisted version rules, bounded session listing, snapshot-consistent role reads, and no query-per-role loops.
  - id: AC-REVIEW-NO-FALLBACK
    statement: Test-only memory persistence/logging implementations are not exported through normal production package entry points.
  - id: AC-REVIEW-REGRESSION
    statement: F1-F4 unit/integration-independent regression suites, registry generation checks, project profile validation, consumer boundary, repository truth, task governance, and trust-root local verification pass after fixes.
  - id: AC-REVIEW-HONEST-MATURITY
    statement: No maturity is promoted to PROVEN and F4 is not advanced unless evidence meets the declared exit rule; environment limitations are reported as blockers rather than hidden or replaced with mocks.
assumptions:
  - statement: The two supplied root context files are evidence sources and do not override ADRs, machine registries, task contracts, runtime/build truth, or executable governance.
    status: verified
    evidence: TAYMEX_CUMULATIVE_EXPERT_REVIEW.md
  - statement: PostgreSQL 18 remains the required runtime and no SQLite or in-memory substitute can satisfy AC-F4-REAL-PROOF.
    status: verified
    evidence: blueprints/project-profiles/taymex.yaml
  - statement: The additive 0002 F4 hardening migration is within the user-authorized F4 repair scope and the predeclared packages/data-postgres/** plus allowMigrations=true authority; enumerating the exact new filename does not authorize destructive migration or any new path class.
    status: verified
    evidence: packages/data-postgres/migrations/0002_f4_integrity_hardening.sql
obligations:
  securityDelta: required
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: tested
functional:
  invariants:
    - Repairs occur at the lowest shared owning layer and do not create parallel local implementations.
    - Runtime/build/database evidence outranks descriptive prose, but any disagreement is reported and fixed.
    - Unknown rollback connection state is destroyed rather than recycled.
    - Persisted optimistic versions advance exactly one step.
    - Idempotency completion is fenced to the exact claim generation.
    - Query loops are replaced by bounded set-based access where the existing foundation rule already requires it.
  statesAndTransitions:
    - F4 remains current until real PostgreSQL 18 proof satisfies the existing stage gate.
  edgeCases:
    - rollback itself fails after a transaction error
    - applied migration file is removed or renamed
    - malformed SQL file exists in the migration directory
    - stale idempotency worker completes after claim expiry and reclamation
    - role assignment changes while access is resolved
    - more sessions exist than the default device/session visibility limit
  failureModes:
    - weakening a gate or maturity rule merely to close the phase
    - keeping two competing sources of database truth without conflict detection
    - exposing memory stores as accidental production persistence choices
    - fixing a shared defect with a feature-local workaround
requiredGates:
