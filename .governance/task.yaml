id: PRODUCT-002
title: Implement Product domain core
mode: feature
risk: R2
objective: Implement and executable-test the canonical Product v0 domain invariants before persistence or HTTP integration, keeping business rules independent from NestJS and database adapters.
baseRevision: 1284c0141c6b9772ef044ac9c82aaeafc01c2ca6
modules:
  - catalog
scope:
  allowedPaths:
    - apps/api/src/modules/catalog/domain/**
    - apps/api/src/modules/catalog/tests/**
    - .governance/task.yaml
  forbiddenPaths:
    - tooling/**
    - .github/**
    - .platform/**
    - apps/web/**
  allowNewFiles: true
  allowedNewFiles:
    - apps/api/src/modules/catalog/domain/product.ts
    - apps/api/src/modules/catalog/tests/product.domain.test.ts
    - .governance/task.yaml
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
acceptance:
  - id: AC-CANONICAL-MODEL
    statement: Product v0 has one canonical TypeScript domain model using the exact fields and category/status vocabulary defined by the slice specification.
  - id: AC-LOCALIZED-NAMES
    statement: Arabic Turkish and English Product names are required and normalized without page-specific validation copies.
  - id: AC-PRICE
    statement: Price amount and currency are either both absent or both valid and present, with no binary floating-point amount in the domain model.
  - id: AC-STATE
    statement: Archived Product is immutable in v0 and publication transitions are explicit.
  - id: AC-CONCURRENCY
    statement: Mutations require expected version and reject stale writes before applying changes.
  - id: AC-TESTS
    statement: Domain tests execute locally without NestJS database or external service dependencies.
assumptions:
  - statement: The canonical Product v0 field/state decisions are approved by PRODUCT-001 slice specification.
    status: verified
    evidence: docs/slices/products/PRODUCTS_VERTICAL_SLICE_V0.md
obligations:
  securityDelta: not-applicable
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: not-applicable
functional:
  invariants:
    - modelCode is non-empty and normalized for canonical comparison.
    - all enabled locale names are non-empty.
    - price amount and currency are an atomic optional pair.
    - archived Product cannot be modified in v0.
    - stale expectedVersion never overwrites a newer Product.
  statesAndTransitions:
    - draft -> published or archived
    - published -> draft or archived
    - archived -> no transition in v0
  edgeCases:
    - whitespace-only localized name
    - malformed or negative price
    - lowercase currency input
    - stale version
    - mutation after archive
  failureModes:
    - invalid input returns a stable domain error code rather than partially mutated Product state.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - RISK-001
  - TRUST-001
  - AUTH-001
