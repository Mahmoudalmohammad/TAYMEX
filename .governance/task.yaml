id: FOUNDATION-F7-001
title: Implement F7 files events notifications and durable side effects
mode: migration
risk: R3
objective: >-
  Implement F7 without broad platform expansion: add one provider-neutral private media-storage contract with deterministic upload validation, path-free original-name metadata, extension/MIME/content agreement, decode/re-encode normalization, random opaque storage keys, integrity hashing, validated metadata, audit-backed authorization-gated download, failed-write cleanup, and compensating authorized delete for the supported image path; add one canonical event/notification runtime boundary with encrypted transactional outbox persistence for identity secret-delivery requests, bounded leasing/retry/dead-letter behavior, provider idempotency, and PostgreSQL 18 proof; keep brokers, generalized worker frameworks, public media serving, and product feature expansion out of scope; keep F7 open until the exact committed implementation revision is proven locally on the pinned toolchain and PostgreSQL 18.
