functional:
  invariants:
    - A stage is never closed by documentation alone; F4 closure requires the real PostgreSQL 18 runtime evidence recorded in this task.
    - Toolchain and artifact bootstrap configuration have one canonical effective policy and do not maintain duplicate competing settings.
    - F4 closure does not promote HTTP/auth transport, production observability delivery, remote merge authority, or later-stage capabilities.
    - The previously hardened exact N-to-N+1 mutation contract remains intact; stale valid mutations return version-conflict and invalid version jumps remain precondition failures.
  statesAndTransitions:
    - F4 current and runtime proof pending -> F4 proven and currentStage F5 only after all closure evidence and governance pass.
  edgeCases:
    - internal tarball depends on another @engineering-platform package that is not directly declared by the consumer application
    - Node types major differs from the approved runtime major
    - stale writer proposes the valid next version after another writer has already won
    - invalid writer attempts to skip an optimistic version
  failureModes:
    - relying on a task verification result whose head predates the canonical local repair commits
    - adding a one-off override for only the dependency that happened to fail
    - allowing public-registry fallback for a locked internal platform package
    - promoting all F2/F3 capabilities merely because their durable PostgreSQL sub-path was proven in F4
