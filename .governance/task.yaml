acceptance:
  - id: AC-F8-RSC-SERIALIZABLE-COPY
    statement: The UiReferenceCopy object passed from the server page into F8ReferenceSurface contains serializable data only and no ordinary function-valued property.
  - id: AC-F8-PAGINATION-LOCALE-PRESERVED
    statement: Arabic, Turkish, and English pagination wording remains locale-specific through a serializable page/count template whose interpolation executes inside the Client Component boundary.
  - id: AC-F8-RSC-RUNTIME-REGRESSION-GATE
    statement: The existing production build and exact-SHA Chromium/CDP proof remain the runtime regression gates; no Server Function, dependency, server action, fallback renderer, page relocation, or client-only routing workaround is introduced.
assumptions:
  - statement: R9 passed sections 1 through 9 and failed first in section 10 because uiReferenceMessages supplied a pageOf function inside the copy prop passed from a Server Component to the client-marked F8ReferenceSurface.
    status: verified
    evidence: F8 local validation R9 first-failure report and web-process.log from 2026-08-30T093144Z.
  - statement: React Server Components require props crossing from Server Components to Client Components to be serializable; ordinary functions are not supported unless they are Server Functions, which is not appropriate for pure pagination label formatting.
    status: verified
    evidence: React use-client and use-server reference documentation reviewed on 2026-08-30.
