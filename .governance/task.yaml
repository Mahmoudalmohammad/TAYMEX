acceptance:
  - id: AC-F8-ONE-DESIGN-SYSTEM
    statement: TAYMEX pages use locked platform tokens, components, patterns and AppShell without local primitive forks, copied component catalogs, raw design colors, or fallback design values.
  - id: AC-F8-THEME
    statement: A single governed TAYMEX theme profile defines approved semantic brand mapping, typography, radii and shell sizing and generates the committed theme CSS deterministically from the locked design-token artifact.
  - id: AC-F8-I18N
    statement: AR, TR and EN routes drive the document lang and dir, preserve locale in navigation, and expose representative number, currency, date, unit and mixed-script formatting without silent translation fallback.
  - id: AC-F8-SHELL
    statement: Public, customer and admin shell information-architecture rules are explicit; the implemented admin shell reuses the shared responsive AppShell for desktop and mobile rather than maintaining separate navigation truth.
  - id: AC-F8-USED-PATTERNS
    statement: The real /{locale}/foundation/ui route exercises the used form states, password, file upload, selection controls, search, table, pagination, tabs, modal, toast, alert, skeleton and empty-state contracts from the locked platform artifacts.
  - id: AC-F8-VERIFICATION-MANIFEST
    statement: Representative AR/TR/EN, light/dark and mobile/tablet/desktop browser scenarios are declared with direction, accessibility smoke, visual and minimum touch-target checks without an exhaustive combinatorial matrix.
  - id: AC-F8-HONEST-MATURITY
    statement: Relevant F8 capabilities advance only to IMPLEMENTED; PROVEN and F8 closure remain blocked until exact-SHA Node 24 and real Chromium runtime evidence is returned and reviewed.
assumptions:
  - statement: The locked 0.2.0 platform UI line and governance 0.1.4 were adopted and trust-verified by the immediately preceding platform transport commit.
    status: verified
    evidence: .platform/runtime.lock.yaml
  - statement: The current project has no approved independent marketing brand palette beyond the accessible semantic mapping recorded in the governed F8 theme profile, so no additional ungoverned colors are invented in application CSS.
    status: verified
    evidence: blueprints/theme-profiles/taymex.yaml
obligations:
  securityDelta: not-applicable
  performance: standard
  ui: standard
  responsive: required
  accessibility: required
  concurrency: not-applicable
  idempotency: not-applicable
functional:
  invariants:
    - UI behavior and visual tokens are consumed from one platform artifact line; TAYMEX owns composition and project theme/profile only.
    - Shared control states are not reimplemented with native feature-local inputs when an approved platform component exists.
    - Locale routing controls document direction and formatting; direction is not hard-coded globally.
    - Primary actions remain discoverable without hover and motion is non-essential and compatible with reduced-motion behavior.
    - Browser proof uses a representative risk-based matrix rather than an unbounded locale × theme × viewport × state product.
    - Conditional and deferred patterns are not materialized until a real consumer requires them.
  edgeCases:
    - direct request to a non-locale route must use the declared default locale rather than trusting an inbound custom header
    - Arabic mixed-script values contain Latin product/unit tokens while the document remains RTL
    - mobile navigation opens as a modal focus scope while desktop navigation remains visible
    - dark theme changes semantic tokens without introducing local raw colors
    - long localized labels must not create horizontal viewport overflow
  failureModes:
    - creating component-v2 or local native-form forks
    - reintroducing a copied component catalog as a second source of truth
    - hard-coding lang, dir, raw colors, z-index, shadows or spacing in product composition
    - marking F8 PROVEN based only on static verification
