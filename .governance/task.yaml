id: FOUNDATION-F7-CLOSURE-002
title: Close F7 from exact-SHA real filesystem and PostgreSQL 18 side-effect proof
mode: fix
risk: R3
objective: >-
  Close F7 from the externally executed exact-SHA validation proof at TAYMEX revision 9affa751b5a5e3be9820aa1ff530be63fd571a33, record the real Node 24/pnpm 11.24/private-filesystem/PostgreSQL 18.6 media and encrypted transactional outbox proof, preserve the deliberately narrow provider-neutral media and side-effect boundaries without adding broker, worker, scheduler, public-media, or multi-provider storage frameworks, promote only files.media-storage and notifications.events-side-effects to PROVEN, preserve all later foundation obligations, make earlier-stage verifiers accept lawful progression, and advance the foundation sequence to F8 readiness without modifying the proven runtime implementation.
baseRevision: 9affa751b5a5e3be9820aa1ff530be63fd571a33
modules:
  - application-foundation
scope:
  allowedPaths:
    - .governance/task.yaml
    - blueprints/foundation/foundation.manifest.yaml
    - docs/FOUNDATION_F7_FILES_SIDE_EFFECTS_REPORT.md
    - docs/evidence/F7_FILES_SIDE_EFFECTS_REAL_PROOF.md
    - scripts/verify-f6-performance.py
    - scripts/verify-f7-files-side-effects.py
  forbiddenPaths:
