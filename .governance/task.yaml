id: FOUNDATION-F6-001
title: Implement F6 deterministic performance foundation
mode: feature
risk: R3
objective: >-
  Implement F6 as a deterministic performance-correctness foundation without expanding Catalog functionality: establish reusable SQL query instrumentation and query-budget evidence, prove bounded list behavior and a representative N+1-resistant database path, add explicit PostgreSQL query-plan/index evidence for that actual path, and keep F6 open until the same committed revision is proven on Node 24, pnpm 11.24, and PostgreSQL 18.
baseRevision: d89d7dfd144acbd56ffd8a7ed26b6733b217b0ce
modules:
  - data-postgres
  - identity
  - audit
  - api-foundation
