id: FOUNDATION-F8-SSR-UNIT-FORMAT-006
title: Repair F8 SSR unit-formatting runtime failure
mode: fix
risk: R2
objective: >-
  Repair the exact F8 server-rendering failure exposed by real Node 24 runtime proof by replacing the unsupported Intl.NumberFormat unit identifier with an ECMA-402 sanctioned representative unit, while keeping TAYMEX solar quantity codes and conversions in the canonical domain quantity layer and changing no F8 behavior beyond the broken proof sample.
