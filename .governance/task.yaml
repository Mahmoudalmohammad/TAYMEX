acceptance:
  - id: AC-F3-SETTINGS-AUTHORITY
    statement: Runtime setting definitions defaults bounds scopes and precedence remain generated from the single canonical settings registry and are resolved only by the versioned platform settings artifact; F3 adds no competing registry fallback or precedence implementation.
  - id: AC-F3-SETTINGS-WRITES
    statement: Mutable setting administration requires explicit canonical permission and AAL2 assurance supports create/update optimistic version checks append-only history rollback as a new version invalid-value rejection and immutable-setting denial.
  - id: AC-F3-SETTINGS-APPLICATION
    statement: Runtime behavior metadata is generated from the canonical registry and settings diagnostics distinguish applied state from saved-but-not-applied reload restart or deploy state without pretending a persisted value is already active.
  - id: AC-F3-AUDIT
    statement: Audit records are append-only structured immutable records with actor resource action changes timestamp correlation category severity and recursive sensitive-value redaction; settings changes and identity security events are mapped into the same audit contract.
  - id: AC-F3-AUDIT-ACCESS
    statement: Reading audit records requires the canonical audit.records.read permission and AAL2 assurance; write-side services never expose mutation or deletion methods for existing audit records.
  - id: AC-F3-OBSERVABILITY
    statement: Structured logging uses canonical correlation identifiers timestamps levels event names runtime metadata and recursive redaction; identity security events can fan out to audit and structured logging without raw credentials or token material.
  - id: AC-F3-HEALTH
    statement: Liveness and readiness are distinct runtime concepts with explicit dependency checks and build environment metadata; existing health routes use the central observability reporter without claiming PostgreSQL readiness before F4.
  - id: AC-F3-REGRESSION
    statement: Existing Catalog setting resolution behavior still uses generated definitions and platform resolution and all pre-F3 foundation Identity Catalog authorization application and settings tests continue to pass.
  - id: AC-F3-FOUNDATION
    statement: Foundation manifest records only demonstrated F3 evidence advances currentStage to F4 and keeps database persistence HTTP transport distributed controls and production delivery proof as explicit later work.
assumptions:
  - statement: F3 uses in-memory reference stores only to prove contracts and negative behavior; durable PostgreSQL implementations are intentionally deferred to F4 and are not claimed by F3.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
  - statement: Existing platform settings resolution artifact remains the sole precedence and value-validation engine and is not forked inside the consumer repository.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
  - statement: Request-level HTTP correlation middleware cookie transport security and distributed rate limiting belong to F5; F3 provides reusable primitives only.
    status: verified
    evidence: docs/FOUNDATION_BLUEPRINT.md
obligations:
  securityDelta: required
  performance: standard
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: not-applicable
functional:
  invariants:
    - Canonical setting precedence is never reimplemented in F3 and no local default may override a generated registry definition.
    - Settings with kind invariant cannot be mutated by the runtime administration service.
    - A setting write with a stale expected version must fail without changing value history applied state or audit evidence.
    - Rollback creates a new setting version; history is never rewritten.
    - Non-hot setting writes remain visibly pending until the matching saved version is explicitly marked applied.
    - Audit and log payloads redact credential secret token cookie authorization and password-like fields recursively.
    - Audit stores expose append and query only; they expose no update or delete contract.
    - Identity security event fanout preserves correlation and non-secret reason while excluding raw secret material.
  statesAndTransitions:
    - Setting absent at version 0 may be created as version 1; each accepted update increments version exactly once.
    - Setting saved version may be APPLIED or PENDING_RELOAD PENDING_RESTART PENDING_DEPLOY based on generated runtime behavior; mark-applied may only acknowledge the current saved version.
    - Readiness is READY only when every registered readiness dependency reports UP; liveness remains a process-level signal independent from external dependency readiness.
  edgeCases:
    - Unauthorized or AAL1 actor attempts to change a setting.
    - Stale setting expectedVersion races with a successful write.
    - Rollback targets a historical version that no longer equals the current version.
    - Sensitive nested metadata contains password token authorization cookie secret or credential-like keys.
    - Incoming correlation identifier is blank malformed or overlong.
    - One identity security sink fails during composite fanout.
    - Readiness contains a DOWN dependency while liveness remains UP.
  failureModes:
    - F3 duplicates setting defaults precedence or fallback outside generated definitions and the platform resolver.
    - Audit records allow post-append mutation or leak sensitive values.
    - Settings history is overwritten or rollback rewrites an old version.
    - Saved settings are reported as active before required reload restart or deployment acknowledgment.
    - Health endpoint reports dependency readiness that has not actually been checked.
    - F3 claims durable audit/settings persistence database atomicity HTTP correlation middleware or production logging delivery before those stages exist.
