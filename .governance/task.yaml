id: FOUNDATION-F6-CLOSURE-003
title: Close F6 from exact-SHA PostgreSQL 18 deterministic performance proof
mode: fix
risk: R3
objective: >-
  Close F6 from the externally executed exact-SHA validation proof at TAYMEX revision c98a084a86a751acd8fe68e49769e9dd4e4c8b7e, record the real Node 24/pnpm 11.24/PostgreSQL 18.6 query-count, bounded-pagination, query-amplification, query-plan/index, HTTP/runtime, governance, trust, consumer-boundary, and handoff evidence, promote only performance.query-runtime to PROVEN, preserve all later foundation obligations, make earlier-stage verifiers accept lawful progression, and advance the foundation sequence to F7 readiness without modifying the proven runtime implementation.
baseRevision: c98a084a86a751acd8fe68e49769e9dd4e4c8b7e
modules:
  - application-foundation
scope:
  allowedPaths:
    - .governance/task.yaml
    - blueprints/foundation/foundation.manifest.yaml
    - docs/FOUNDATION_F6_PERFORMANCE_REPORT.md
    - docs/evidence/F6_POSTGRESQL18_PERFORMANCE_PROOF.md
    - scripts/verify-f5-api-security.py
    - scripts/verify-f6-performance.py
  forbiddenPaths:
    - .github/**
    - tooling/governance.config.yaml
    - tooling/policies/**
    - tooling/schemas/**
    - tooling/trust-root/**
    - tooling/registry/**
    - .platform/**
    - apps/**
    - packages/**
    - contracts/**
    - package.json
    - pnpm-lock.yaml
  allowNewFiles: true
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
  allowVisualBaselineChanges: false
  allowBreakingContractChanges: false
  allowDestructiveMigrations: false
  allowControlPlaneChanges: false
  allowTrustRootChanges: false
acceptance:
  - id: AC-F6-CLOSURE-EXACT-SHA
    statement: F6 closure evidence is tied to exact TAYMEX revision c98a084a86a751acd8fe68e49769e9dd4e4c8b7e and ENGINEERING_PLATFORM revision c3d865ee97f33c7d0247e00fdd02e0c771ea6f98, with Node 24.14.0, pnpm 11.24.0, and PostgreSQL 18.6 / 180006 recorded.
  - id: AC-F6-CLOSURE-DETERMINISTIC
    statement: Real PostgreSQL proof demonstrates one-query representative audit retrieval, repeated fingerprint budget one, bounded-list rejection before database I/O, no reviewed-loop database I/O, set-based identity persistence, and use of the existing audit_records_action_idx without introducing a performance-only index.
  - id: AC-F6-CLOSURE-NO-LATENCY-FRAMEWORK
    statement: F6 remains a deterministic performance-correctness foundation and does not introduce generalized load testing or synthetic p95/p99 PR gates.
  - id: AC-F6-CLOSURE-RUNTIME
    statement: The exact proven revision passes clean install, build, typecheck, package tests, PostgreSQL 18 migrations and regressions, real HTTP integration, and actual API health/readiness smoke.
  - id: AC-F6-CLOSURE-GOVERNANCE
    statement: The governed F6 implementation and hygiene repair segments pass governance and trust verification; consumer boundary and handoff verification pass on the exact proven final revision.
  - id: AC-F6-CLOSURE-MATURITY
    statement: Only performance.query-runtime is promoted by F6 proof, F6 is closed, the foundation advances only to F7 readiness, and later capabilities remain at their prior maturity.
  - id: AC-F6-CLOSURE-NONRUNTIME
    statement: The closure diff contains only task metadata, maturity/evidence documentation, and structural verifier updates; no runtime, SQL, dependency, migration, contract, platform, or trust-root implementation changes are introduced after the exact-SHA proof.
assumptions:
  - statement: The operator executed the full F6 validation harness on TAYMEX c98a084a86a751acd8fe68e49769e9dd4e4c8b7e with all fourteen sections passing and returned the raw validation ZIP without modifying the tested repository.
    status: verified
    evidence: docs/evidence/F6_POSTGRESQL18_PERFORMANCE_PROOF.md
  - statement: The returned proof package has SHA-256 4aabd7f64c290def141055ccc33acc86aa52637b21731927395fd5b13f893b2a and records PostgreSQL server_version_num 180006.
    status: verified
    evidence: docs/evidence/F6_POSTGRESQL18_PERFORMANCE_PROOF.md
  - statement: The accompanying ENGINEERING_PLATFORM revision remains c3d865ee97f33c7d0247e00fdd02e0c771ea6f98.
    status: verified
    evidence: docs/evidence/F6_POSTGRESQL18_PERFORMANCE_PROOF.md
obligations:
  securityDelta: not-applicable
  performance: critical-budget
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: tested
  idempotency: tested
functional:
  invariants:
    - Stage closure is based on real exact-SHA PostgreSQL and runtime evidence, not on documentation or structural checks alone.
    - The F6 closure commit must not modify the runtime implementation proven at c98a084a86a751acd8fe68e49769e9dd4e4c8b7e.
    - PASS belongs to the tested SHA and is reusable by the closure commit only because the closure diff is non-runtime and cannot affect the proven SQL, HTTP, migration, query-count, query-plan, or persistence behavior.
    - F6 proof does not imply generalized load capacity, p95/p99 SLO proof, production traffic saturation, remote merge authority, UI/browser proof, or later side-effect and operations proof.
    - Product feature expansion remains blocked until the complete Foundation Readiness Gate passes.
  statesAndTransitions:
    - F6 implemented with exact-SHA PostgreSQL proof pending -> F6 PROVEN and CLOSED only after returned raw evidence is independently reviewed.
    - F6 CLOSED -> currentStage F7 means F7 READY only; it does not mean F7 implementation has started or any F7 capability has been promoted.
  edgeCases:
    - local validation can reveal syntax/toolchain defects that structural verification did not execute
    - compiler-generated metadata can dirty a repository after otherwise successful typechecking
    - PostgreSQL query plans are only accepted for the declared representative real path and existing index
    - closure metadata must not be mistaken for a new runtime revision requiring fabricated proof
  failureModes:
    - using proof from an older runtime SHA after a runtime-affecting change
    - promoting unrelated later-stage capabilities because F6 passed
    - broadening F6 into a generalized benchmark or latency framework
    - weakening governance, trust, query budgets, or verifiers to transform a failed proof into PASS
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
  - MODEL-001
  - DATA-001
