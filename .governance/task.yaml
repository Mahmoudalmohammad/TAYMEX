acceptance:
  - id: AC-F8-PROXY-DEFINITE-LOCALE
    statement: The locale proxy never passes string-or-undefined to locale membership checks or request headers; missing path segments resolve to the governed default locale without changing supported-locale behavior.
  - id: AC-F8-PROXY-BUILD-GATE
    statement: The existing web TypeScript/build gates remain the regression protection for this strict-typing defect; no local workaround, dependency, or duplicate locale resolver is introduced.
assumptions:
  - statement: The F8 real local validation on bd9ea862 failed first at Next.js production TypeScript checking in apps/web/proxy.ts before Chromium proof began.
    status: verified
    evidence: F8 local validation first-failure report for bd9ea862 on Node v24.14.0 and pnpm 11.24.0.
