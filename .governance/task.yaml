id: FOUNDATION-F9-REMOTE-TRUST-014
title: Activate and prove real GitHub remote trust and merge controls on Mahmoudalmohammad/TAYMEX
mode: security-change
risk: R4
objective: >-
  Activate remote trust authority on the real GitHub repository Mahmoudalmohammad/TAYMEX, resolve CODEOWNERS with the authenticated repository owner @Mahmoudalmohammad, configure and enforce GitHub Ruleset with required status checks (trust-root, governance-summary, f9-production-delivery) on default branch main, advance governance.trust-root capability to PROVEN, and execute real negative proof proving merge is blocked before checks succeed.
baseRevision: 902761be424743e7d91d8bcd970a40963821f571
modules:
  - application-foundation
scope:
  allowedPaths:
    - .governance/task.yaml
    - .github/CODEOWNERS
    - operations/f9/production-delivery.authority.yaml
    - blueprints/foundation/foundation.manifest.yaml
    - scripts/verify-f9-production-delivery.py
    - docs/evidence/F9_REMOTE_TRUST_ACTIVATION_PROOF.md
  forbiddenPaths:
    - .github/workflows/trust-root.yml
    - .github/workflows/governance.yml
    - tooling/trust-root/**
    - tooling/schemas/trust-root.schema.json
    - .platform/**
    - apps/**
    - packages/**
    - contracts/**
    - pnpm-lock.yaml
  allowNewFiles: true
  allowedNewFiles:
    - docs/evidence/F9_REMOTE_TRUST_ACTIVATION_PROOF.md
  allowDependencies: false
  allowMigrations: false
  allowPublicContractChanges: false
  allowPlatformChanges: false
  allowArchitectureChanges: false
  allowVisualBaselineChanges: false
  allowBreakingContractChanges: false
  allowDestructiveMigrations: false
  allowControlPlaneChanges: true
  allowTrustRootChanges: false
acceptance:
  - id: AC-F9-REMOTE-TRUST-ACTIVATED
    statement: The production-delivery authority records activationStatus ACTIVATED and binds exact repository coordinates Mahmoudalmohammad/TAYMEX with default branch main.
  - id: AC-F9-CODEOWNERS-RESOLVED
    statement: CODEOWNERS placeholder @taymex/platform-owners is replaced with real authenticated repository owner @Mahmoudalmohammad across all protected control-plane paths.
  - id: AC-F9-RULESET-ACTIVE
    statement: Active GitHub Ruleset on main enforces pull requests, blocks direct deletion, blocks non-fast-forward pushes, and requires status checks trust-root, governance-summary, and f9-production-delivery.
  - id: AC-F9-REAL-NEGATIVE-PROOF
    statement: A real GitHub Pull Request proves that merge is strictly blocked when required status checks have not passed, and becomes merge-eligible only after checks succeed.
  - id: AC-F9-TRUST-ROOT-PROVEN
    statement: The capability governance.trust-root transitions from INTEGRATED to PROVEN with zero remaining obligations.
assumptions:
  - statement: Mahmoudalmohammad/TAYMEX is the authenticated and accessible remote repository with admin permissions.
    status: verified
    evidence: operations/f9/production-delivery.authority.yaml
obligations:
  securityDelta: required
  performance: not-applicable
  ui: not-applicable
  responsive: not-applicable
  accessibility: not-applicable
  concurrency: not-applicable
  idempotency: required
functional:
  invariants:
    - Default branch main must reject direct force push and deletion.
    - Pull requests targeting main must fail merge evaluation until required status checks pass.
    - Codeowner placeholder identities must not remain in active production governance.
  statesAndTransitions:
    - remoteTrust.activationStatus -> ACTIVATED
    - governance.trust-root -> PROVEN
  edgeCases:
    - Personal free accounts enforce rulesets on public repositories without requiring GitHub Enterprise.
    - Ordinary pull requests must wait for required status checks before merge eligibility.
  failureModes:
    - Claiming PROVEN without active remote ruleset enforcement.
    - Retaining placeholder CODEOWNERS handles.
requiredGates:
  - TASK-001
  - BASE-001
  - SCP-001
  - SCP-002
  - DEP-001
  - PLT-001
  - RISK-001
  - TRUST-001
  - MODEL-001
  - DATA-001
