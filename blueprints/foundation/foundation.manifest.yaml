  maturityOrder:
    - NOT_STARTED
    - DESIGNED
    - IMPLEMENTED
    - INTEGRATED
    - PROVEN
    - PRODUCTION_PROVEN
  readinessRule: Every capability with requiredBeforeFeatureExpansion=true must be at or above exitMaturity.
  currentStage: F8
  validationSlice:
