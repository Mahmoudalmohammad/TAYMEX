version: 1
permissions:
  - key: catalog.products.read
    owner: catalog
    description: Read and list Product administration data.
    scope: global
    sensitivity: normal
    lifecycle: experimental

  - key: catalog.products.manage
    owner: catalog
    description: Create edit and change publication status of Products.
    scope: global
    sensitivity: privileged
    lifecycle: experimental

  - key: identity.accounts.manage
    owner: identity
    description: Manage account security state and privileged account administration.
    scope: global
    sensitivity: privileged
    lifecycle: experimental

  - key: identity.roles.manage
    owner: identity
    description: Create roles and manage canonical role-to-permission assignments.
    scope: global
    sensitivity: privileged
    lifecycle: experimental

  - key: identity.sessions.manage
    owner: identity
    description: Revoke or inspect sessions beyond the authenticated account's own sessions.
    scope: global
    sensitivity: privileged
    lifecycle: experimental
